name: Desktop build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        working-directory: app-go
        run: go run gen/release.go

      - name: Check
        run: |
          ls -l dist
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: minikeyboard-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS
