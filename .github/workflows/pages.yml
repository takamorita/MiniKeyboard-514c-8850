name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp ui.html _site/index.html
          cp catalog.js pad-wire.js pad-model.js pad-driver.js _site/
          touch _site/.nojekyll

      - name: Check the site is complete
        run: |
          for f in index.html catalog.js pad-wire.js pad-model.js pad-driver.js; do
            test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          ls -l _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
