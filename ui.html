/* keep the invisible input glued to the caret so IME candidates land there */
function positionInput(){
  const inp=$('#chipIn'), S=$('#chipStrip'); if(!inp||!S) return;
  const c=S.querySelector('.caret.on')||S.querySelector('.caret');
  if(!c) return;
  inp.style.left=(c.offsetLeft)+'px';
  inp.style.top =(c.offsetTop)+'px';
}

/* undo (spec 10). Snapshot before every mutation; deep-copy so mods arrays
   never alias. */
function snap(){
  return {SEQ:SEQ.map(r=>({...r,mods:(r.mods||[]).slice()})),
          caret:CARET,sela:SELA,selb:SELB};
}
function restore(s){
  SEQ=s.SEQ.map(r=>({...r,mods:(r.mods||[]).slice()}));
  CARET=Math.min(s.caret,SEQ.length); SELA=s.sela; SELB=s.selb;
  if(SELB>SEQ.length){ clearSel(); }
}
function pushUndo(){ UNDO.push(snap()); if(UNDO.length>200) UNDO.shift();
  REDO=[]; }
function undo(){ if(!UNDO.length) return; REDO.push(snap());
  restore(UNDO.pop()); renderChips(); }
function redo(){ if(!REDO.length) return; UNDO.push(snap());
  restore(REDO.pop()); renderChips(); }

/* The single insertion entry point (spec 4). EVERY path funnels through
   here: typing, paste, the picker. Owns the fusion rule (spec 5) with both
   guards, dedup, the standalone constraint, the 40-chip cap, the undo push
   and the re-render.

   row : {kind:'key'|'mouse'|'media', code:int, label?:str, ms?:int, mods?:[]}
   at  : caret index 0..SEQ.length; defaults to the live caret.
   returns true if SEQ changed. */
function insertChip(row,at){
  if(!row) return false;
  if(at===undefined||at===null) at=CARET;
  at=Math.max(0,Math.min(at|0,SEQ.length));
  const kind=row.kind||'key';
  const mods=sortMods(row.mods||[]);

  // --- standalone constraint (spec 8): mouse/media replace the whole seq
  if(kind!=='key'){
    pushUndo();
    SEQ=[{kind,code:row.code||0,label:row.label,ms:0,mods:[],
          ...(row.mouse?{mouse:row.mouse}:{})}];
    clearSel(); CARET=1; renderChips(); return true;
  }
  if(isSpecial()){
    toast(CAT.t('toast.noCombine'));
    return false;
  }

  // --- fusion (spec 5): a bare modifier folds into the chip on its right
  if(isMod(row.code) && !mods.length){
    const nxt=SEQ[at];
    if(nxt){
      if(nxt.kind!=='key'){                       // guard 2: mouse/media
        toast(CAT.t('toast.noModsSpecial'));
        return false;
      }
      if(isMod(nxt.code) && !(nxt.mods||[]).length){
        // modifier in front of a bare modifier chip: merge them into one
        if(nxt.code===row.code) return false;      // guard 1: dedup
        pushUndo();
        nxt.mods=sortMods([...(nxt.mods||[]),row.code]);
        clearSel(); CARET=at+1; renderChips(); return true;
      }
      if((nxt.mods||[]).includes(row.code)) return false;  // guard 1: dedup
      pushUndo();
      nxt.mods=sortMods([...(nxt.mods||[]),row.code]);
      clearSel(); CARET=at+1; renderChips(); return true;
    }
    // no following key -> stays a standalone modifier chip
  }

  /* Reverse fusion: a key landing immediately after bare modifier chips
     absorbs them. The firmware always fuses the modifier slots preceding a
     key, so a standalone modifier chip cannot survive a key to its right.
     This is what makes Ctrl, then Alt, then Delete give Ctrl+Alt+Delete. */
  if(!isMod(row.code)){
    let a=at;
    while(a>0){
      const p=SEQ[a-1];
      if(p&&p.kind==='key'&&isMod(p.code)&&!(p.mods||[]).length) a--; else break;
    }
    if(a<at){
      const absorbed=SEQ.slice(a,at).map(r=>r.code);
      const merged=sortMods([...new Set([...mods,...absorbed])]);
      pushUndo();
      SEQ.splice(a,at-a,{kind:'key',code:row.code,label:row.label,
                         ms:row.ms||0,mods:merged});
      clearSel(); CARET=a+1; renderChips(); return true;
    }
  }

  if(SEQ.length>=MAXCHIPS){                        // spec 8: 41st is refused
    // ruling: the rejection is never silent -- fixed wording
    toast(CAT.t('toast.maxChips',{n:MAXCHIPS}));
    return false;
  }
  pushUndo();
  SEQ.splice(at,0,{kind:'key',code:row.code,label:row.label,
                   ms:row.ms||0,mods:mods});
  clearSel(); CARET=at+1; renderChips(); return true;
}
window.insertChip=insertChip;

/* delete chips in [a,b); leaves the caret where they were */
function deleteRange(a,b){
  a=Math.max(0,a); b=Math.min(SEQ.length,b);
  if(b<=a) return false;
  pushUndo(); SEQ.splice(a,b-a); clearSel(); CARET=a; renderChips(); return true;
}
function replaceSelection(row){
  if(!hasSel()) return insertChip(row,CARET);
  const a=SELA;
  pushUndo();
  SEQ.splice(a,SELB-a); clearSel(); CARET=a;
  // re-push would double-snapshot, so splice in without a second undo entry
  const keep=UNDO.pop();
  const changed=insertChip(row,a);
  if(changed){ UNDO[UNDO.length-1]=keep; } else { UNDO.push(keep); renderChips(); }
  return changed;
}

/* typing / IME */
function typeText(txt){
  if(!txt) return;
  const bad=[]; let n=0, capped=false;
  for(const ch of txt){
    const r=charToRow(ch);
    if(!r){ bad.push(ch); continue; }
    if(SEQ.length>=MAXCHIPS){ capped=true; break; }
    if(n===0 && hasSel()) replaceSelection(r); else insertChip(r,CARET);
    n++;
  }
  if(bad.length) toast(CAT.t('toast.badChars',{c:[...new Set(bad)].join(' ')}));
  if(capped) toast(CAT.t('toast.chipsCut',{n:MAXCHIPS}));
}
function toast(t){ msg(t,'err'); }

/* chip popover (spec 9). Opened by Enter on a selection, or by a SECOND click
   on an already selected chip. Edits go through the same SEQ mutation +
   pushUndo + renderChips path as everything else.

   POP_I is the chip index the panel is bound to, re-validated on every render
   because undo/redo can shrink SEQ underneath an open panel. */
let POP_I=-1, POP_RIGHT=false;
const POPMODS=[[0xF1,'Ctrl'],[0xF2,'Shift'],[0xF3,'Alt'],[0xF4,'Win']];
/* Spelled to match CAT.MODS, or the same key gets two names on one screen.
   Not read from CAT: this is a top-level const and CAT arrives later, with
   the dynamic import. */
const POPRMODS=[[0xF5,'RCtrl'],[0xF6,'RShift'],[0xF7,'RAlt'],[0xF8,'RWin']];

const popOpenFor=i=>POP_I===i&&$('#chippop').classList.contains('open');

function closeChipPopover(){
  const p=$('#chippop'); if(p) p.classList.remove('open');
  POP_I=-1; POP_RIGHT=false;
}
function openChipPopover(i){
  const r=SEQ[i];
  if(!r){ closeChipPopover(); return; }
  POP_I=i;
  // open the 右▸ group already expanded if this chip uses a right-side mod
  POP_RIGHT=(r.mods||[]).some(m=>m>=0xF5);
  setSel(i,i+1);
  renderChips();                       // paints selection + calls syncPopover
  $('#chippop').classList.add('open');
  drawPopover();
  focusStrip();
}
window.openChipPopover=openChipPopover;

/* re-render + reposition an open panel after any SEQ change */
function syncPopover(){
  const p=$('#chippop'); if(!p||!p.classList.contains('open')) return;
  if(!SEQ[POP_I]){ closeChipPopover(); return; }
  drawPopover();
}

function drawPopover(){
  const p=$('#chippop'), r=SEQ[POP_I];
  if(!p||!r) return;
  const special=r.kind!=='key';
  const mods=r.mods||[];
  // an active right-side mod always keeps its toggle reachable
  if(mods.some(m=>m>=0xF5)) POP_RIGHT=true;
  const tog=(c,n)=>`<button class="modtog${mods.includes(c)?' on':''}"`
    +` data-testid="popmod-${n}" data-nolabel`
    +` onclick="popToggleMod(${c})">${esc(n)}</button>`;

  let h=`<div class="pophd"><b>${esc(chipText(r))}</b>`
    +`<span>${esc(CAT.t('chip.kindSteps',{
        kind:CAT.t(special?(r.kind==='mouse'?'chip.mouse':'chip.media'):'chip.key'),
        n:rowCost(r)}))}</span></div>`;

  if(!special){
    // spec 9: modifier toggles, right-hand side folded behind 右▸
    h+=`<div class="poprow"><label>${esc(CAT.t('chip.mods'))}</label>`
      +POPMODS.map(([c,n])=>tog(c,n)).join('')
      +`<button class="rmore" data-nolabel onclick="popToggleRight()"`
      +` data-testid="popright">${esc(CAT.t('chip.rightMods'))}`
      +`${POP_RIGHT?'▾':'▸'}</button>`
      +`<div class="rgroup${POP_RIGHT?' open':''}">`
      +POPRMODS.map(([c,n])=>tog(c,n)).join('')+'</div></div>';
    h+=`<div class="poprow"><label>${esc(CAT.t('chip.delay'))}</label>`
      +`<input type="number" id="popMs" data-testid="popms" min="0" max="6000"`
      +` step="50" value="${r.ms||0}" oninput="popSetMs(this.value)">`
      +`<span class="hintline" style="margin:0">${esc(CAT.t('chip.msRange'))}</span></div>`;
  }
  h+='<div class="popfoot">'
    +`<button data-nolabel onclick="popReselect()">${esc(CAT.t('chip.reselect'))}</button>`
    +'<div class="grow"></div>'
    +'<button class="danger" data-nolabel data-testid="popdel"'
    +` onclick="popDelete()">${esc(CAT.t('chip.delete'))}</button>`
    +`<button data-nolabel onclick="closeChipPopover()">${esc(CAT.t('chip.close'))}</button>`
    +'</div>';
  if(special) h+=`<div class="hintline">${esc(CAT.t('chip.soloNote'))}</div>`;
  p.innerHTML=h;
  placePopover();
}

/* anchor under the bound chip, clamped inside .chipwrap so it never clips */
function placePopover(){
  const p=$('#chippop'), S=$('#chipStrip');
  if(!p||!S) return;
  const c=S.querySelector(`.chip[data-i="${POP_I}"]`);
  if(!c) return;
  const w=p.offsetWidth||326;
  const max=Math.max(0,S.offsetWidth-w-4);
  p.style.left=Math.max(0,Math.min(c.offsetLeft,max))+'px';
  p.style.top =(c.offsetTop+c.offsetHeight+6)+'px';
}

/* popover actions: each mutates SEQ, pushes undo, and re-renders. */
function popToggleMod(code){
  const r=SEQ[POP_I]; if(!r||r.kind!=='key') return;
  pushUndo();
  const m=(r.mods||[]).slice();
  const at=m.indexOf(code);
  if(at>=0) m.splice(at,1); else m.push(code);
  r.mods=sortMods(m);
  renderChips();                      // label + badge + meter + syncPopover
}
/* The disclosure may not hide an ACTIVE right-side toggle: the chip label
   would show RCtrl with no way to switch it off. Collapsing is refused while
   any right mod is set. */
function popToggleRight(){
  const r=SEQ[POP_I];
  const usesRight=r&&(r.mods||[]).some(m=>m>=0xF5);
  POP_RIGHT=usesRight?true:!POP_RIGHT;
  drawPopover();
}
function popSetMs(v){
  const r=SEQ[POP_I]; if(!r||r.kind!=='key') return;
  let n=parseInt(v,10); if(!isFinite(n)) n=0;
  n=Math.max(0,Math.min(6000,n));
  if(n===(r.ms||0)) return;
  pushUndo(); r.ms=n; renderChips();
}
function popDelete(){
  const i=POP_I; closeChipPopover();
  deleteRange(i,i+1); focusStrip();
}
/* 「一覧から選び直す」: a transient "reselect" mode on the picker panel. The
   next pick swaps only the key code -- mods and ms survive (spec 9). */
let POP_RESELECT=-1;
function popReselect(){
  const i=POP_I;
  if(!SEQ[i]) return;                   // nothing to swap -> never arm the mode
  POP_RESELECT=i;
  closeChipPopover();
  syncPickerHead();
  const p=$('#pkPanel'); if(p&&p.scrollIntoView) p.scrollIntoView({block:'nearest'});
  const s=$('#psearch'); if(s){ s.value=''; CANDS=[]; CSEL=0; renderCands(''); s.focus(); }
}
/* 「やめる」 and every other route out of the mode. Idempotent, so the banner
   can never get stuck. */
function cancelReselect(){
  POP_RESELECT=-1; syncPickerHead(); focusStrip();
}
/* Called from the picker paths when a reselect is pending; returns true if it
   consumed the pick. This replaces a row, so insertChip stays the only
   insertion path. */
function applyReselect(kind,code,label){
  const i=POP_RESELECT; POP_RESELECT=-1;
  const r=SEQ[i];
  if(!r){ syncPickerHead(); return false; }   // stale index -> fall back to insert
  pushUndo();
  if(kind!=='key'){
    // mouse/media are standalone: the whole sequence collapses to it
    SEQ=[{kind,code:code||0,label,ms:0,mods:[]}];
    clearSel(); CARET=1; renderChips(); return true;
  }
  if(r.kind!=='key'){                 // was mouse/media, now a plain key
    SEQ[i]={kind:'key',code,label,ms:0,mods:[]};
  }else{
    SEQ[i]={kind:'key',code,label,ms:r.ms||0,mods:sortMods(r.mods||[])};
  }
  setSel(i,i+1); renderChips();
  openChipPopover(i);
  return true;
}
window.addEventListener('resize',()=>{ if(POP_I>=0) placePopover(); });

/* interaction. A single click SELECTS only; a second click on an already
   selected chip opens the popover (Enter does too, spec 3). */
function chipClick(i){
  const already=hasSel()&&SELA===i&&SELB===i+1&&!popOpenFor(i);
  setSel(i,i+1);
  renderChips(); focusStrip();
  if(already) openChipPopover(i);
}
function stripMouseDown(ev){
  // clicking empty strip space parks the caret at the nearest gap
  const S=$('#chipStrip');
  const carets=[...S.querySelectorAll('.caret')];
  let best=SEQ.length, bd=Infinity;
  carets.forEach((c,i)=>{
    const r=c.getBoundingClientRect();
    const d=Math.abs(ev.clientX-r.left)+Math.abs(ev.clientY-(r.top+r.height/2))*3;
    if(d<bd){ bd=d; best=i; }
  });
  closeChipPopover();
  clearSel(); CARET=best; renderChips();
  ev.preventDefault(); focusStrip();
}

function chipKey(ev){
  if(!editorOpen()) return;
  const k=ev.key, N=SEQ.length;
  const stop=()=>{ev.preventDefault(); ev.stopPropagation();};

  /* An open popover is bound to one chip, so anything moving the caret or
     selection makes it stale. Esc and Enter handle themselves below. */
  if(POP_I>=0 && k!=='Escape' && k!=='Enter') closeChipPopover();

  if(ev.ctrlKey||ev.metaKey){
    const lk=k.toLowerCase();
    if(lk==='z'){ stop(); ev.shiftKey?redo():undo(); return; }
    if(lk==='y'){ stop(); redo(); return; }
    if(lk==='a'){ stop(); if(N){ setSel(0,N); renderChips(); } return; }
    return;                                   // let Ctrl+C/V etc. through
  }
  if(ev.altKey){
    if(k==='ArrowLeft'||k==='ArrowRight'){     // reorder the selection
      stop();
      if(!hasSel()) return;
      const d=k==='ArrowLeft'?-1:1;
      const a=SELA,b=SELB;
      if(d<0&&a===0) return;
      if(d>0&&b===N) return;
      pushUndo();
      const cut=SEQ.splice(a,b-a);
      const at=a+d;
      SEQ.splice(at,0,...cut);
      setSel(at,at+cut.length); renderChips();
    }
    return;
  }

  if(k==='ArrowLeft'||k==='ArrowRight'){
    stop();
    const d=k==='ArrowLeft'?-1:1;
    if(ev.shiftKey){
      // Shift+arrows grow a range; the caret is the moving edge
      let a,b;
      if(hasSel()){ a=SELA; b=SELB;
        if(CARET<=a){ a=Math.max(0,a+d); CARET=a; }
        else { b=Math.min(N,b+d); CARET=b; }
      }else{
        if(d<0){ a=Math.max(0,CARET-1); b=CARET; CARET=a; }
        else   { a=CARET; b=Math.min(N,CARET+1); CARET=b; }
      }
      setSel(a,b);
    }else if(hasSel()){
      CARET=d<0?SELA:SELB; clearSel();        // collapse to the near gap
    }else{
      CARET=Math.max(0,Math.min(N,CARET+d));
    }
    renderChips(); return;
  }
  if(k==='Home'||k==='End'){
    stop();
    const t=k==='Home'?0:N;
    if(ev.shiftKey){ const anc=hasSel()?(CARET<=SELA?SELB:SELA):CARET;
      setSel(Math.min(anc,t),Math.max(anc,t)); CARET=t; }
    else { clearSel(); CARET=t; }
    renderChips(); return;
  }
  if(k==='Backspace'){
    stop();
    if(hasSel()) deleteRange(SELA,SELB);
    else if(CARET>0) deleteRange(CARET-1,CARET);
    return;
  }
  if(k==='Delete'){
    stop();
    if(hasSel()) deleteRange(SELA,SELB);
    else if(CARET<N) deleteRange(CARET,CARET+1);
    return;
  }
  if(k==='Escape'){
    stop();
    // Esc peels one layer at a time: reselect mode, popover, selection, focus
    if(POP_RESELECT>=0){ cancelReselect(); return; }
    if(POP_I>=0){ const i=POP_I; closeChipPopover(); setSel(i,i+1);
      renderChips(); return; }
    if(hasSel()){ CARET=SELA; clearSel(); renderChips(); }
    else { $('#chipIn').blur(); renderChips(); }
    return;
  }
  /* Enter / Tab / Space are content here, not commands, so they insert their
     own chip. Save is button-only (spec 3). Enter on a selection opens the
     popover instead. */
  if(k==='Enter'||k==='Tab'||k===' '||k==='Spacebar'){
    stop();
    if(k==='Enter'&&hasSel()){
      const i=SELA;
      if(typeof openChipPopover==='function'){ try{ openChipPopover(i); }catch(e){} }
      return;
    }
    const code=k==='Enter'?0x28:k==='Tab'?0x2B:0x2C;
    const row={kind:'key',code,label:hidLabel(code),ms:0,mods:[]};
    if(hasSel()) replaceSelection(row); else insertChip(row,CARET);
    return;
  }
  // printable single characters
  if(k.length===1&&!ev.ctrlKey&&!ev.metaKey&&!ev.altKey){
    stop();
    const r=charToRow(k);
    if(!r){ toast(CAT.t('toast.badChars',{c:k})); return; }
    if(hasSel()) replaceSelection(r); else insertChip(r,CARET);
    return;
  }
}

/* IME: wait for compositionend, then one confirmed char per chip (spec 3) */
let COMPOSING=false;
function bindChipInput(){
  const inp=$('#chipIn'); if(!inp||inp.dataset.bound) return;
  inp.dataset.bound='1';
  inp.addEventListener('keydown',ev=>{ if(COMPOSING) return; chipKey(ev); });
  inp.addEventListener('compositionstart',()=>{COMPOSING=true;});
  inp.addEventListener('compositionend',ev=>{
    COMPOSING=false; inp.value='';
    const t=ev.data||'';
    if(hasSel()&&t){ const first=charToRow(t[0]);
      if(first){ replaceSelection(first); typeText(t.slice(1)); return; } }
    typeText(t);
  });
  inp.addEventListener('input',()=>{ if(!COMPOSING) inp.value=''; });
  inp.addEventListener('focus',()=>{ $('#chipStrip').classList.add('focus');
    renderChips(); });
  inp.addEventListener('blur',()=>{ $('#chipStrip').classList.remove('focus'); });
  inp.addEventListener('paste',ev=>{
    ev.preventDefault();
    const t=(ev.clipboardData||window.clipboardData).getData('text')||'';
    pasteText(t);
  });
}
/* paste: plain text -> chips, truncated at the 40-chip cap (spec 8) */
function pasteText(t){
  if(!t) return;
  const chars=[...t];
  const room=MAXCHIPS-SEQ.length+(hasSel()?SELB-SELA:0);
  const bad=[];
  const rows=[];
  for(const ch of chars){
    const r=charToRow(ch);
    if(r) rows.push(r); else bad.push(ch);
  }
  const take=rows.slice(0,Math.max(0,room));
  const cut=rows.length>take.length;
  if(hasSel()&&take.length){ replaceSelection(take[0]); take.shift(); }
  else if(hasSel()){ deleteRange(SELA,SELB); }
  take.forEach(r=>insertChip(r,CARET));
  if(bad.length) toast(CAT.t('toast.badChars',{c:[...new Set(bad)].join(' ')}));
  else if(cut) toast(CAT.t('toast.chipsCut',{n:MAXCHIPS}));
}

/* What makes a sequence unwritable. A trailing modifier is allowed:
   Win-alone is a legal binding (start menu). */
const MODSET=new Set([0xF1,0xF2,0xF3,0xF4,0xF5,0xF6,0xF7,0xF8]);
function validateSeq(){
  const n=SEQ.length, max=MAXSLOT(), cost=seqCost();
  if(!n) return {ok:false,why:CAT.t('ed.nothingChosen')};
  if(cost>max) return {ok:false,
    why:CAT.t('ed.overBudget',{c:cost,m:max})};
  const sp=SEQ.filter(x=>x.kind!=='key');
  if(sp.length&&n>1)
    return {ok:false,why:CAT.t('toast.noCombine')};
  return {ok:true};
}

/* Turn typed text into steps. "A" costs two slots (Shift + a) because the
   firmware stores modifiers as inline pseudo-usages, not as a bitmask. */
/* A row is {kind,code,label,ms,mods:[0xF1..]}: modifiers belong to the row and
   are flattened into separate slots only when writing to the device. */
const MODLIST=[[0xF1,'Ctrl'],[0xF2,'Shift'],[0xF3,'Alt'],[0xF4,'Win']];
function rowCost(r){ return 1+(r.mods?r.mods.length:0); }
function seqCost(){ return SEQ.reduce((n,r)=>n+rowCost(r),0); }
function toggleMod(i,code){
  const r=SEQ[i]; if(!r||r.kind!=='key') return;
  r.mods=r.mods||[];
  const at=r.mods.indexOf(code);
  if(at>=0) r.mods.splice(at,1); else r.mods.push(code);
  r.mods.sort((a,b)=>a-b);
  renderSeq();
}
/* Flatten rows into the wire order the firmware expects: mods, then the key. */
function flatten(){
  const out=[];
  for(const r of SEQ){
    for(const m of (r.mods||[]))
      out.push({kind:'key',code:m,label:MODS_NAME(m),ms:0});
    out.push({kind:r.kind,code:r.code,label:r.label,ms:r.ms||0});
  }
  return out;
}
function MODS_NAME(c){ const f=MODLIST.find(m=>m[0]===c); return f?f[1]:hidLabel(c); }

function charToRow(ch){
  const info=(META.chars||{})[ch];
  if(info) return {kind:'key',code:info.usage,label:ch,ms:0,
                   mods:info.shift?[0xF2]:[]};
  const lo=ch.toLowerCase();
  if(lo>='a'&&lo<='z')
    return {kind:'key',code:0x04+(lo.charCodeAt(0)-97),label:lo,ms:0,
            mods:ch!==lo?[0xF2]:[]};
  if(ch===' ') return {kind:'key',code:0x2C,label:'Space',ms:0,mods:[]};
  return null;
}

/* searchable catalog. Every entry carries English + Japanese aliases. `pri`
   breaks ties: plain characters outrank modifiers, so "w" offers w before
   Windows. */
let CATALOG=[];
function buildCatalog(){
  const C=[];
  /* `name` is what pickSpecial() resolves against; `label` is what the row
     shows. Passing the label as the name makes Japanese rows unpickable. */
  const add=(label,kind,code,alias,pri,badge,mods,name)=>
    C.push({label,kind,code,alias:alias.map(a=>a.toLowerCase()),pri,badge,
            mods:mods||[],name:name||label});

  // plain characters -- highest priority, so "a" finds a before Alt
  for(const [ch,info] of Object.entries(META.chars||{})){
    if(info.shift) continue;
    add(ch,'key',info.usage,[ch,'char '+ch],0,'');
  }
  // letters/digits by name even when chars{} is sparse
  'abcdefghijklmnopqrstuvwxyz'.split('').forEach((c,i)=>{
    if(!C.some(e=>e.label===c)) add(c,'key',0x04+i,[c],0,'');
  });
  /* SHIFTED glyphs (`A`, `!`, `?`): 2 slots, so the ₂ badge and mods:[Shift].
     pri 0 keeps them with the plain characters -- searching "A" must find
     `A`, not Alt. scoreEntry() lowercases the query, so `A` and `a` collide
     by design and are separated by the pri tiebreak; keep pri distinct. */
  for(const [ch,info] of Object.entries(META.chars||{})){
    if(!info.shift) continue;
    add(ch,'key',info.usage,[ch,'char '+ch],1,'₂',[0xF2]);
  }
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach((c,i)=>{
    if(!C.some(e=>e.label===c)) add(c,'key',0x04+i,[c],1,'₂',[0xF2]);
  });
  // modifiers
  [['Ctrl',0xF1,['ctrl','control','コントロール','せいぎょ']],
   ['Shift',0xF2,['shift','シフト','しふと']],
   ['Alt',0xF3,['alt','オルト','あると']],
   ['Win',0xF4,['win','windows','ウィンドウズ','スタート','meta','super','ウィン']],
   ['RCtrl',0xF5,['rctrl','right ctrl','みぎctrl','右ctrl','右コントロール']],
   ['RShift',0xF6,['rshift','right shift','みぎshift','右shift','右シフト']],
   ['RAlt',0xF7,['ralt','right alt','みぎalt','右alt','右オルト']],
   ['RWin',0xF8,['rwin','right win','みぎwin','右win','右ウィン']]]
   .forEach(([n,c,a])=>add(n,'key',c,a,2,CAT.t('pk.badgeMod')));
  // F13-F24
  for(let i=0;i<12;i++) add('F'+(i+13),'key',0x68+i,['f'+(i+13)],1,'');
  // navigation / editing
  [['↑',0x52,['up','うえ','じょう','uparrow','やじるし','↑']],
   ['↓',0x51,['down','した','downarrow','やじるし','↓']],
   ['←',0x50,['left','ひだり','leftarrow','やじるし','←']],
   ['→',0x4F,['right','みぎ','rightarrow','やじるし','→']],
   ['Home',0x4A,['home','ホーム']],['End',0x4D,['end','エンド']],
   ['PageUp',0x4B,['pageup','pgup','ページアップ']],
   ['PageDown',0x4E,['pagedown','pgdn','ページダウン']],
   ['Insert',0x49,['insert','ins','インサート']],
   ['Delete',0x4C,['delete','del','デリート','さくじょ']],
   ['Esc',0x29,['esc','escape','エスケープ']],
   ['Tab',0x2B,['tab','タブ']],
   ['Enter',0x28,['enter','return','エンター','かいぎょう']],
   ['Backspace',0x2A,['backspace','bs','バックスペース']],
   ['Space',0x2C,['space','スペース','くうはく']],
   ['CapsLock',0x39,['capslock','caps','キャップス']],
   ['PrintScreen',0x46,['printscreen','prtsc','プリントスクリーン']],
   ['ScrollLock',0x47,['scrolllock','スクロールロック']],
   ['Pause',0x48,['pause','ポーズ']]]
   .forEach(([n,c,a])=>add(n,'key',c,a,1,''));
  // JIS-only keys
  [['ろ \_',0x87,['ro','ろ','backslash']],
   ['￥ ¥|',0x89,['yen','￥','¥','えん']],
   ['かな',0x88,['kana','かな','ひらがな']],
   ['変換',0x8A,['henkan','へんかん','変換']],
   ['無変換',0x8B,['muhenkan','むへんかん','無変換']],
   ['半角/全角',0x35,['hankaku','zenkaku','はんかく','ぜんかく','全角']]]
   .forEach(([n,c,a])=>add(n,'key',c,a,1,''));
  /* mouse / media -- standalone only. Use the same label the button shows,
     and take the Japanese words as search terms, or the search answers
     "bass" with BassDown while the button reads 低音−. */
  CAT.mouseActions().forEach(a=>
    add(a.label,'mouse',0,
        [a.label,a.name,...(CAT.MOUSE_ALIASES[a.name]||[]),
         'mouse','マウス','まうす','クリック'],
        3,CAT.t('pk.badgeSolo'),[],a.name));
  CAT.mediaList().forEach(m=>
    add(m.label,'media',0,
        [m.label,m.name,...(m.alias||[]),'media','メディア'],
        3,CAT.t('pk.badgeSolo'),[],m.name));

  CATALOG=C;
}

/* score a catalog entry against the query; null = no match */
function scoreEntry(e,q){
  let best=null;
  for(const a of e.alias){
    let s=null;
    if(a===q) s=0;                       // exact
    else if(a.startsWith(q)) s=1;        // prefix
    // substring only at a word boundary, so "a" does not drag in "arrow up"
    else if(a.split(/[\s\-_]+/).some(w=>w.startsWith(q))) s=2;
    if(s!==null && (best===null||s<best)) best=s;
  }
  if(best===null) return null;
  return best*10 + e.pri;                // exactness dominates, pri breaks ties
}
function searchCatalog(q){
  q=q.trim().toLowerCase();
  if(!q) return [];
  return CATALOG
    .map(e=>({e,s:scoreEntry(e,q)}))
    .filter(x=>x.s!==null)
    .sort((a,b)=>a.s-b.s || a.e.label.length-b.e.label.length)
    .slice(0,40).map(x=>x.e);
}

let CANDS=[], CSEL=0;
function onSearch(){
  const q=$('#psearch').value;
  CANDS=searchCatalog(q); CSEL=0;
  renderCands(q);
}
function renderCands(q){
  const L=$('#cands'), box=$('#psearch');
  if(!q.trim()){ L.innerHTML=''; box.classList.remove('bad'); return; }
  if(!CANDS.length){
    L.innerHTML='<div class="nohit" style="grid-column:1/-1">'
                +esc(CAT.t('pk.noMatch'))+'</div>';
    box.classList.add('bad'); return;              // invalid input -> red
  }
  box.classList.remove('bad');
  // the grid must exist before its column count can be read, so seed it first
  L.innerHTML='<i></i>';
  const COLS=colCount(L);
  const ROWS=Math.ceil(CANDS.length/COLS);
  const order=[];
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++){const k=c*ROWS+r; if(k<CANDS.length) order.push(k);}
  L.innerHTML=order.map(oi=>{const e=CANDS[oi], i=oi;
    const bc=e.badge===CAT.t('pk.badgeMod')?'mod'
            :e.badge===CAT.t('pk.badgeSolo')?'sp':'';
    return `<button class="${i===CSEL?'on':''}" onclick="takeCand(${i})">
      <span class="nm">${esc(e.label)}</span>
      ${e.badge?`<span class="cbadge ${bc}">${e.badge}</span>`:''}
      <span class="meta">${e.kind==='key'
        ?'0x'+e.code.toString(16).toUpperCase():e.kind}</span></button>`;
  }).join('');
}
function colCount(L){
  const t=getComputedStyle(L).gridTemplateColumns;
  const n=t&&t!=='none'?t.trim().split(/\s+/).length:1;
  return Math.max(1,n);
}
window.addEventListener('resize',()=>{
  // the panel is always live while the editor is open; reflow its columns
  if($('#ov').classList.contains('open')) renderCands($('#psearch').value);
});
function searchKey(ev){
  if(ev.key==='Escape'){                 // an escape hatch from inside the box
    ev.preventDefault();
    if(POP_RESELECT>=0){ cancelReselect(); return; }
    $('#psearch').value=''; CANDS=[]; CSEL=0; renderCands(''); focusStrip();
    return;
  }
  if(!CANDS.length) return;
  const n=CANDS.length, COLS=colCount($('#cands'));
  const ROWS=Math.ceil(n/COLS);
  const move=d=>{CSEL=(CSEL+d+n)%n;renderCands($('#psearch').value);ev.preventDefault();};
  if(ev.key==='ArrowDown')      move(1);          // down a column
  else if(ev.key==='ArrowUp')   move(-1);
  else if(ev.key==='ArrowRight')move(ROWS);       // across to the next column
  else if(ev.key==='ArrowLeft') move(-ROWS);
  else if(ev.key==='Enter'){takeCand(CSEL);ev.preventDefault();}
}
function takeCand(i){
  const e=CANDS[i]; if(!e) return;
  if(e.kind!=='key') pickSpecial(e.kind,e.name);
  else pickKey(e.code,e.label,e.mods);
}

/* ---------- inline key picker panel ----------
   The picker is no longer a modal. It is a permanent panel inside the editor
   sheet, below the sequence buttons. There is exactly ONE picker UI. Selections
   still funnel through insertChip() (spec 4); nothing about insertion changed,
   only the host element. */
/* The three blocks are the device's own kinds: a chip is a key, a mouse
   action or a media action, and never two of those (insertChip enforces it).
   Modifiers are deliberately NOT here -- they are a state that attaches to
   whichever of these you pick, so they live in the always-visible row above.
   CHIPSPEC 14. */
const PBLOCKS=[['key','pk.keyboard'],['mouse','pk.mouse'],['media','pk.media']];
/* called once per editor open: (re)builds the panel and clears the search */
function initPicker(){
  PICK_ROW=CARET; PSHIFT=false; ARMED=[];
  if(!CATALOG.length) buildCatalog();
  $('#psearch').value=''; CANDS=[]; CSEL=0; renderCands('');
  $('#jumps').innerHTML=PBLOCKS.map(([k,key])=>
    `<button id="jm_${k}" onclick="jumpTo('${k}')">${esc(CAT.t(key))}</button>`).join('');
  renderModRow(); renderBlocks();
  POP_RESELECT=-1; syncPickerHead();
}

/* the always-visible modifier row (CHIPSPEC 14.2). Armed modifiers are a
   pending state, not chips: they ride along with the next pick and are then
   cleared. Arming Shift also flips the character grid to its shifted glyphs,
   so there is one Shift, not two. */
let ARMED=[];               // modifier codes waiting for the next pick

function renderModRow(){
  const R=$('#modrow'); if(!R) return;
  const btn=c=>`<button data-testid="mod${c.toString(16)}"
     class="${ARMED.includes(c)?'on':''}" aria-pressed="${ARMED.includes(c)}"
     onclick="toggleArm(${c})">${MODNAMES[c]}</button>`;
  R.innerHTML=`<span class="mlab">${esc(CAT.t('pk.modsLabel'))}</span>`
    +MODS_LEFT.map(btn).join('')
    /* The right-hand four are simply shown, not behind a toggle. */
    +`<div class="rgroup open">`
    +MODS_RIGHT.map(btn).join('')+'</div>'
    +`<span class="mhint">${ARMED.length
        ? CAT.t('pk.modsArmed',{m:esc(ARMED.map(c=>MODNAMES[c]).join('+'))})
        : CAT.t('pk.modsIdle')
      }</span>`;
}
function toggleArm(code){
  /* Arming assumes modifier first, then the key. In three cases the modifier
     belongs to the sequence NOW instead:

       caret on a key       caret before v plus Ctrl means Ctrl+v
       caret on mouse/media fusion is impossible; say so rather than arm
       nothing to pick yet  Win alone is a real binding (the Start menu)

     Hand these to insertChip and let its fusion rule decide. */
  if(!ARMED.includes(code) && !hasSel()){
    const at=SEQ[CARET];
    if(at && (at.kind==='key' || at.kind==='mouse' || at.kind==='media')){
      pickKey(code, MODNAMES[code]);
      return;
    }
    /* Nothing to fuse onto. Ctrl, Shift and Alt ARM: they are the three the
       device can carry on a mouse binding, so "Ctrl, then ホイール↑" must
       work on an empty key. Inserting a lone Ctrl chip instead loses it
       silently -- a mouse action REPLACES the sequence.

       Win and the right-hand four keep inserting: they cannot ride a mouse
       binding, so a lone press means the binding itself. */
    const ARMS_ALONE = [0xF1,0xF2,0xF3];
    if(!SEQ.length && !ARMS_ALONE.includes(code)){
      pickKey(code, MODNAMES[code]); return;
    }
  }
  ARMED=ARMED.includes(code) ? ARMED.filter(c=>c!==code)
                             : sortMods([...ARMED,code]);
  renderModRow();
  renderChips();   // the ghost chip at the caret follows the armed state
  // Shift changes what the character buttons say, so the board must follow
  if(code===0xF2) { PSHIFT=ARMED.includes(0xF2); renderBlocks(); }
  else renderBlocks();   // the mouse block's note names the armed modifier
}
/* Consume the armed modifiers: returns them and clears the row, so the same
   arming cannot leak into the pick after next. */
function takeArmed(){
  const a=ARMED;
  if(a.length){ ARMED=[]; PSHIFT=false; renderModRow(); renderBlocks(); renderChips(); }
  return a;
}
/* Armed modifiers with no key: a standalone modifier chip (Win by itself
   opens the Start menu). */
function insertArmedAlone(){
  const a=takeArmed(); if(!a.length) return false;
  for(const c of a) pickKey(c,MODNAMES[c]);
  return true;
}
function jumpTo(k){
  const el=$('#blk_'+k); if(!el) return;
  PBLOCKS.forEach(([t])=>$('#jm_'+t)?.classList.toggle('on',t===k));
  el.scrollIntoView({block:'start',behavior:'smooth'});
}
/* the panel header tells the user where the next pick lands, and shows the
   reselect banner when a chip is being swapped */
function syncPickerHead(){
  const m=$('#pkMode'); if(!m) return;
  if(POP_RESELECT>=0){
    m.classList.add('on');
    $('#pkModeText').textContent=CAT.t('pk.reselecting',{n:POP_RESELECT+1});
    $('#pkFor').textContent=CAT.t('pk.reselectNote');
  }else{
    m.classList.remove('on');
    /* Only the reselect banner: it is a MODE and nothing else says so. */
    $('#pkFor').textContent='';
  }
}
/* 文字・数字 tab. The grid is derived from META.chars, NEVER from HID key
   names: HID 0x30 is called "RBracket" while a JIS board types `[` with it.

   Shift is a TOGGLE over the whole grid, not a second set of buttons: a glyph
   and its shifted partner are the same physical key, and with the toggle on
   EVERY button costs 2 slots, which one banner states once. */
let PSHIFT=false;
function charGlyphs(shift){
  const map=shift?CHARSHIFT:CHARBASE;         // built from META.chars
  const letters=[],digits=[],syms=[];
  const seen=new Set();
  for(const [codeStr,ch] of Object.entries(map)){
    const code=+codeStr;
    if(ch===undefined||ch===null||ch==='') continue;
    if(seen.has(ch)) continue; seen.add(ch);
    if(code>=0x04&&code<=0x1D) letters.push([code,ch]);
    else if(code>=0x1E&&code<=0x27) digits.push([code,ch]);
    else syms.push([code,ch]);
  }
  const byCode=(a,b)=>a[0]-b[0];
  letters.sort(byCode);
  // 1..9 then 0 -- 0x27 is `0` and must read last, as it does on the board
  digits.sort(byCode);
  syms.sort(byCode);
  return {letters,digits,syms};
}
/* Shift is one state shared with the modifier row; this arms or disarms it
   there. */
function setPShift(on){
  const want=!!on;
  if(want!==ARMED.includes(0xF2)) toggleArm(0xF2);
}
/* one delegated handler: glyphs include ' " & < > which cannot be embedded
   safely in an inline onclick= (esc() does not escape quotes) */
function pgridClick(ev){
  const b=ev.target.closest('button[data-ch]');
  if(!b) return;
  pickChar(b.getAttribute('data-ch'));
}
/* Render all three blocks at once: the jump tabs move the viewport, they do
   not hide anything. Blocks the current sequence cannot accept are dimmed
   rather than removed. */
function renderBlocks(){
  const B=$('#pblocks'); if(!B) return;
  const special=isSpecial();
  const b=(lab,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${esc(lab)}</button>`;
  const cb=ch=>`<button class="chbtn" data-ch="${esc(ch)
                 .replace(/"/g,'&quot;')}">${esc(ch)}</button>`;
  const grp=(title,list)=>list.length
    ? `<div class="pgroup"><span class="pglab">${title}</span>`
      +list.map(([,ch])=>cb(ch)).join('')+'</div>' : '';

  const {letters,digits,syms}=charGlyphs(PSHIFT);
  /* Headings name what the buttons PRODUCE, not the physical row: with Shift
     armed the number row types ! " #. */
  const digLab=CAT.t(PSHIFT?'pk.digitsShift':'pk.digits');
  const symLab=CAT.t(PSHIFT?'pk.symbolsShift':'pk.symbols');

  const nav=[['↑',0x52],['↓',0x51],['←',0x50],['→',0x4F],
    ['Home',0x4A],['End',0x4D],['PageUp',0x4B],['PageDown',0x4E],
    ['Insert',0x49],['Delete',0x4C],['Esc',0x29],['Tab',0x2B],
    ['Enter',0x28],['Backspace',0x2A],['Space',0x2C],['CapsLock',0x39],
    ['PrintScreen',0x46],['ScrollLock',0x47],['Pause',0x48]];
  const jis=[['ろ \_',0x87],['￥ ¥|',0x89],['かな',0x88],
             ['変換',0x8A],['無変換',0x8B],['半角/全角',0x35]];

  const keyBlock=
    /* No headings -- キーボード / マウス / メディア are in the fixed half
       above. The ids stay so the tabs can still jump here. */
    `<div class="pblock${special?' dim':''}" id="blk_key">`
    +`<div class="pblab">${esc(CAT.t('pk.keyboard'))}</div>`
    +(special?`<div class="pnote">${esc(CAT.t('pk.blockedSpecial'))}</div>`:'')
    +'<div class="pgrid" id="pgrid" data-testid="pgrid">'
    +'<div class="pnote">'+CAT.t('pk.charsNote')
    +(PSHIFT?CAT.t('pk.shiftCost'):'')+'</div>'
    +grp(CAT.t('pk.letters'),letters)+grp(digLab,digits)+grp(symLab,syms)
    +`<div class="pgroup"><span class="pglab">${esc(CAT.t('pk.navEdit'))}</span>`
    +nav.map(([n,c])=>b(n,`pickKey(${c},'${n}')`,'wide')).join('')+'</div>'
    +`<div class="pgroup"><span class="pglab">${esc(CAT.t('pk.fkeys'))}</span>`
    +Array.from({length:12},(_,i)=>{const n='F'+(i+13);
        return b(n,`pickKey(${0x68+i},'${n}')`);}).join('')+'</div>'
    +`<div class="pgroup"><span class="pglab">${esc(CAT.t('pk.jisKeys'))}</span>`
    +jis.map(([n,c])=>b(n,`pickKey(${c},'${n}')`,'wide')).join('')+'</div>'
    +'</div></div>';

  const mouseActions=CAT.mouseActions();
  const soloNote=`<div class="pnote">${esc(CAT.t('pk.soloNote'))}</div>`;
  /* Only Ctrl / Shift / Alt fit on the wire for a mouse action, hence naming
     them rather than saying "修飾". */
  /* How the user learns the modifier row reaches mouse actions at all. When
     something IS armed it names what will be attached instead. */
  const mouseMod=ARMED.length
    ? '<div class="pnote">'
      +CAT.t('pk.mouseArmed',{m:esc(ARMED.map(c=>MODNAMES[c]).join('+'))})
      +(ARMED.some(c=>!CAT.MOUSE_MOD_OK[c])?CAT.t('pk.mouseArmedDrop'):'')
      +'</div>'
    : `<div class="pnote">${CAT.t('pk.mouseHint')}</div>`;
  /* A rule and a quiet label, not a heading: without one the mouse and media
     buttons run together as one wall. */
  const blockLab=x=>`<div class="pblab">${esc(x)}</div>`;
  const mouseBlock=
    `<div class="pblock" id="blk_mouse">`+blockLab(CAT.t('pk.mouse'))+`<div class="pgrid">`
    +soloNote+mouseMod
    +mouseActions.map(a=>b(a.label,`pickSpecial('mouse','${a.name}')`,'wide')).join('')
    +'</div></div>';
  const mediaBlock=
    `<div class="pblock" id="blk_media">`+blockLab(CAT.t('pk.media'))+`<div class="pgrid">`
    +soloNote
    +CAT.mediaList().map(m=>b(m.label,`pickSpecial('media','${m.name}')`,'wide')).join('')
    +'</div></div>';

  B.innerHTML=keyBlock+mouseBlock+mediaBlock;
  B.onclick=pgridClick;
}

/* Both picker paths funnel through insertChip, so the fusion rule, dedup
   guards, standalone constraint and undo apply identically to the picker,
   to typing and to paste. */
function pickKey(code,label,mods){
  // a pending 「一覧から選び直す」 replaces the key in place, keeping mods+ms
  // (the chip's OWN mods win there by spec 9, so `mods` is an insert-only hint)
  if(POP_RESELECT>=0 && applyReselect('key',code,label)){
    takeArmed(); afterPick(); return;
  }
  POP_RESELECT=-1;                      // a dead index must never linger
  /* Whatever is armed applies to this pick and is then consumed. Armed
     modifiers merge: Ctrl armed + Shift picked gives Ctrl+Shift. */
  const armed=isMod(code)?[]:takeArmed();
  const row={kind:'key',code,label,ms:0,
             mods:sortMods([...new Set([...(mods||[]),...armed])])};
  if(hasSel()) replaceSelection(row); else insertChip(row,CARET);
  afterPick();
}
/* 文字・数字 tab: the button knows only the GLYPH. charToRow() is the single
   place that turns a glyph into {code,mods} via META.chars, so the JIS layout
   wins (`[` -> 0x30). Ends in pickKey -> insertChip. */
function pickChar(ch){
  const r=charToRow(ch);
  if(!r){ toast(CAT.t('toast.badChar',{c:ch})); return; }
  pickKey(r.code,ch,r.mods);
}
function pickSpecial(kind,name){
  /* A mouse action is three wire fields (button, wheel, modifier), not one
     code, so the chip carries the whole action. */
  if(kind==='mouse'){
    const a=CAT.MOUSE_ACTION_BY_NAME[String(name).toLowerCase()];
    if(!a) return pickSpecialNamed(kind,name);
    /* Where an armed modifier ends up is decided here, when the binding is
       built: the mod byte on a mouse action, an inline code on a keyboard
       key. Only ONE of Ctrl/Shift/Alt fits in that byte, so say what could
       not be carried rather than dropping it quietly. */
    const r=CAT.armMouse(a,ARMED);
    if(r.dropped.length){
      toast(CAT.t('toast.mouseModOne',
            {d:r.dropped.map(c=>MODNAMES[c]).join(', ')}));
      return;
    }
    takeArmed();          // consumed by this pick, exactly like a key pick
    return pickMouse(r.action);
  }
  return pickSpecialNamed(kind,name);
}
function pickMouse(a){
  if(ARMED.length){
    toast(CAT.t('toast.mouseNoMods'));
    return;
  }
  POP_RESELECT=-1;
  insertChip({kind:'mouse',code:a.buttons,label:a.label,ms:0,
              mouse:{buttons:a.buttons,wheel:a.wheel,mod:a.mod}});
  afterPick();
}
function pickSpecialNamed(kind,label){
  /* Media has nowhere to put a modifier -- the usage IS the whole binding --
     so refuse rather than silently drop an armed Ctrl. */
  if(ARMED.length){
    toast(CAT.t('toast.mediaNoMods'));
    return;
  }
  if(POP_RESELECT>=0 && applyReselect(kind,0,label)){
    afterPick(); return;
  }
  POP_RESELECT=-1;
  /* Resolve to the real usage and display name here, or a media chip reads
     "BassUp" while the button that made it says 低音＋. */
  const code=kind==='media' ? (CAT.MEDIA_BY_NAME[String(label).toLowerCase()]||0) : 0;
  const shown=kind==='media' && code ? CAT.mediaLabel(code) : label;
  insertChip({kind,code,label:shown,ms:0});
  afterPick();
}
/* the panel stays open: a pick clears the search box and returns the caret
   to the strip */
function afterPick(){
  POP_RESELECT=-1;
  $('#psearch').value=''; CANDS=[]; CSEL=0; renderCands('');
  renderBlocks();          // a special chip dims the keyboard block, and back
  syncPickerHead();
  focusStrip();
}

/* 他のキーへコピー (spec 11). Picks a target (+layer) and writes the SAME
   spec/delays there over the existing path -- no new wire format, no new
   insertion path.

   copyToPayload() is split out so the payload can be inspected without
   firing anything at the device. */
let CP_TARGET=null, CP_LAYER=1;

function copyTargets(){
  return (META.targets||[]).map(t=>typeof t==='string'?t:t.name);
}
function copyToPayload(target,layer){
  return {target,layer,spec:seqToSpec(),
          delays:flatten().map(s=>s.ms||0),delay:0};
}
window.copyToPayload=copyToPayload;

function openCopyTo(){
  const v=validateSeq();
  if(!v.ok){ msg(v.why,'err'); return; }
  closeChipPopover();
  CP_TARGET=null; CP_LAYER=LAYER;
  $('#cpFrom').textContent=CAT.t('cp.from',{k:SEL,L:LAYER});
  /* Show what the key will do, in the same words the chips use -- not the
     wire encoding. */
  const waits=flatten().filter(x=>x.ms>0).length;
  $('#cpPrev').textContent=SEQ.map(chipText).join(' \u2192 ')
    +(waits?CAT.t('cp.waits',{n:waits}):'');
  drawCopyTo();
  $('#cp').classList.add('open');
}
function closeCopyTo(){ const e=$('#cp'); if(e) e.classList.remove('open');
  CP_TARGET=null; }
function drawCopyTo(){
  $('#cpLayers').innerHTML=[1,2,3].map(n=>
    `<button class="${n===CP_LAYER?'on':''}" onclick="setCopyLayer(${n})">`
    +esc(CAT.t('pad.layer',{n}))+'</button>').join('');
  const mine=(n)=>n===SEL&&CP_LAYER===LAYER;
  $('#cpTargets').innerHTML=copyTargets().map(n=>
    `<button class="${n===CP_TARGET?'on':''}" ${mine(n)?'disabled':''}`
    +` data-testid="cptarget" onclick="setCopyTarget('${n}')"`
    +` title="${esc(n)}">${esc(n)}</button>`).join('');
  const go=$('#cpGo'); if(go) go.disabled=!CP_TARGET;
  $('#cpNote').textContent=CP_TARGET
    ? CAT.t('cp.targetIs',{k:CP_TARGET,L:CP_LAYER})
    : CAT.t('cp.pickTarget');
}
function setCopyLayer(n){ CP_LAYER=n;
  if(CP_TARGET===SEL&&n===LAYER) CP_TARGET=null;
  drawCopyTo(); }
function setCopyTarget(n){ CP_TARGET=n; drawCopyTo(); }
function doCopyTo(){
  if(!CP_TARGET) return;
  const v=validateSeq();
  if(!v.ok){ msg(v.why,'err'); return; }
  try{
    setDraft(MODEL.withBinding(DRAFT,seqToBinding(CP_TARGET,CP_LAYER)));
    msg(CAT.t('msg.copiedTo',{k:CP_TARGET,L:CP_LAYER}),'ok');
    closeCopyTo();
  }catch(e){ msg(e.message,'err'); }
}

/* saving. The chips become a binding object, not a string: flatten() already
   produces the wire order. seqToSpec survives only for the hex preview, which
   is a debug aid. */
function seqToSpec(){
  if(!SEQ.length) return '';
  if(SEQ[0].kind!=='key') return SEQ[0].label;
  return flatten().map(s=>'0x'+s.code.toString(16)).join('+');
}
/** The chips as the driver wants them: numeric key id, kind, codes, delays. */
function seqToBinding(targetName,layer){
  const keyId=CAT.nameToKeyId(targetName);
  if(keyId===null) throw new Error('unknown target: '+targetName);
  const head=SEQ[0];
  if(head&&head.kind==='mouse'){
    /* The chip carries the three wire fields directly, so nothing has to
       guess the wheel from label text that translation changes. */
    const m=head.mouse
      || CAT.MOUSE_ACTION_BY_NAME[String(head.label||'').toLowerCase()]
      || {buttons:head.code||0, wheel:0, mod:0};
    return {keyId,layer,kind:CAT.KIND_MOUSE,codes:[],delays:[],
            mouse:{mod:m.mod|0,buttons:m.buttons|0,wheel:m.wheel|0}};
  }
  if(head&&head.kind==='media'){
    const code=head.code||CAT.MEDIA_BY_NAME[(head.label||'').toLowerCase()]||0;
    return {keyId,layer,kind:CAT.KIND_MEDIA,codes:[code],delays:[0]};
  }
  const flat=flatten();
  return {keyId,layer,kind:CAT.KIND_KEYBOARD,
          codes:flat.map(x=>x.code), delays:flat.map(x=>x.ms||0)};
}
/* An edit lands in the draft, not on the pad: nothing here reaches hardware,
   so no device need be present. */
function saveSeq(){
  const v=validateSeq();
  if(!v.ok) return msg(v.why,'err');
  try{
    setDraft(MODEL.withBinding(DRAFT,seqToBinding(SEL,LAYER)));
    msg(CAT.t('msg.savedKey',{k:SEL}),'ok');
    closeEditor();
  }catch(e){ msg(e.message,'err'); }
}

/* LED */
const curMode=()=>META&&META.modes.find(x=>x.n==+$('#ledMode').value);
/* By mode number, not by what the dropdown shows: the write diff covers all
   three layers and two are not on screen. */
const modeTraits=n=>META&&META.modes.find(x=>x.n===(n|0));
/* The bar says which mode, what it does, and the 12 colours, so closing it
   is not a loss. `perKey` comes from LED_MODE_TRAITS: a mode that ignores the
   palette greys the strip rather than hiding it. */
function syncLedBar(){
  const m=curMode(), a=$('#ledarea');
  if(!a) return;
  a.dataset.mode = m?m.n:0;
  a.dataset.perkey = (!m||m.perKey)?'1':'0';
  $('#barName').textContent = m?m.label:'';
  $('#barWhy').textContent  = m?m.help:'';
  $('#barStrip').innerHTML = COLORS.slice(0,12).map(c=>
    `<i style="background:${c||'#000000'}"></i>`).join('');
  /* Dim is the look; disabled is the behaviour. pointer-events:none stops the
     mouse but not the keyboard, and a tab-focused colour input would still
     stage a colour the pad throws away. */
  const noCol = !!(m && !m.perKey);
  $('#ledWhy').textContent = noCol ? (m.noColor||'') : '';
  $('#ledColors').querySelectorAll('input,button').forEach(el=>{
    el.disabled = noCol; });
  /* The pad shows the mode, not just the colours -- see the CSS. The flag on
     .device is separate from the mode number so the case does not repeat the
     catalog's list of animated modes. */
  const K=$('#keys'); if(K) K.dataset.mode = m?m.n:0;
  $('.device').classList.toggle('animated', !!(m&&m.animated));
  syncPadHint();
  syncLedTarget();
}
/* Which keys the next swatch click paints. Reads SEL, the same selection the
   pad and the editor use. */
function syncLedTarget(){
  const t=$('#ledTarget'); if(!t) return;
  const m=SEL&&SEL.match(/^key(\d+)$/);
  if(m){
    const e=byName(SEL), lab=e&&e.label!=='NULL'?e.label:'';
    t.innerHTML=CAT.t('led.targetOne',
      {n:+m[1], q:lab?' \u201c'+esc(lab)+'\u201d':''});
  }else{
    t.innerHTML=CAT.t('led.targetAll');
  }
}
/* Open/closed is a standing preference. Storage access itself throws when the
   browser has site data switched off, so both directions are guarded. */
const LED_OPEN_KEY='macropad.ledOpen';
function ledAreaOpen(open){
  applyLedOpen(open);
  try{ localStorage.setItem(LED_OPEN_KEY,open?'1':'0'); }catch{ /* no store */ }
}
/* Two things speak through the one line under the pad: what a key click does,
   and how to preview the light. Both callers go through here or whoever wrote
   last wins. Click meaning comes first. */
function syncPadHint(){
  const open=$('#ledarea').classList.contains('open'), m=curMode();
  $('#padHint').textContent = open
    ? CAT.t('pad.hintPaint')
    : (m&&(m.n===2||m.n===3)) ? CAT.t('pad.hintHover') : CAT.t('pad.hint');
}
/* A key click means two different things depending on this, so the hint must
   say which is live -- otherwise opening the palette silently rewires the
   pad. */
function applyLedOpen(open){
  $('#ledarea').classList.toggle('open',open);
  $('#ledbar').setAttribute('aria-expanded',open?'true':'false');
  syncPadHint();
  if(!open&&SEL&&/^key\d+$/.test(SEL)&&!$('#ov').classList.contains('open')){
    SEL=null; render();               // a paint target outlives nothing
  }
  syncLedTarget();
}
function toggleLedArea(){ ledAreaOpen(!$('#ledarea').classList.contains('open')); }
function restoreLedArea(){
  let v=null;
  try{ v=localStorage.getItem(LED_OPEN_KEY); }catch{ /* no store */ }
  applyLedOpen(v==='1');
}
/* Colour edits go into the draft like any other edit, so they survive a
   reload and are visible to the write button. */
function commitColors(){
  const mode=+$('#ledMode').value, t=modeTraits(mode);
  /* Switching into a mode that ignores colour must NOT restage the colours:
     the pad keeps reporting whatever was last written to it, so a different
     set here leaves draft and device permanently unequal and the write button
     lit for a change no write can settle. COLORS is untouched, so the palette
     returns intact when a colour mode is chosen again. */
  const keep = t && !t.perKey && DEVICE && DEVICE.leds && DEVICE.leds[LAYER];
  setDraft(MODEL.withLeds(DRAFT,LAYER,mode,
    keep ? keep.colors.slice(0,12) : COLORS.slice(0,12)));
}
/* The gate, in one place. The swatches are <i> elements with inline handlers,
   so `disabled` does not apply and CSS pointer-events is only a look. */
function colorsUsed(){ const m=curMode(); return !m || m.perKey; }
function useSwatch(hex){
  if(!colorsUsed()) return;
  const m=SEL&&SEL.match(/^key(\d+)$/);
  if(m)COLORS[+m[1]-1]=hex;
  else for(let i=0;i<12;i++)COLORS[i]=hex;
  $('#ledAll').value=hex; commitColors();
}
function applyAll(){if(!colorsUsed())return;const c=$('#ledAll').value;
  for(let i=0;i<12;i++)COLORS[i]=c;commitColors();}
/* The LED mode is in the same record as the colours, so changing it is an
   edit, not just a help-text change. */
function onLedMode(){ commitColors(); }   // commitColors -> refresh -> syncLedBar
/* Aim the palette at one key, using the same SEL the editor and pad read.
   Clicking the selected key again aims back at all twelve. */
function pickForPaint(n){
  SEL = SEL===n ? null : n;
  render(); syncLedTarget();
}
/* writing. One button, at the end, for everything: the diff is the work list
   and it is written in one run. The run is shown first, because it is the
   only irreversible thing on the page. */
function openWrite(){
  /* Recompute rather than trust the cached PENDING: this is the one place
     where being wrong writes to hardware. */
  PENDING = DRAFT ? MODEL.diff(DRAFT,DEVICE) : {count:0,bindings:[],leds:[]};
  if(!PAD){ msg(CAT.t('msg.noDevice'),'err'); return; }
  const d=PENDING;
  if(!d.count){ msg(CAT.t('msg.sameAsDevice'),'ok'); return; }
  $('#wrSub').textContent=CAT.t('wr.sub',{n:d.count});
  $('#wrList').innerHTML=describeDiff(d);
  /* The device needs WRITE_GAP + COMMIT_GAP per item; a user told nothing
     pulls the cable. */
  const secs=Math.ceil(d.count*1.1);
  $('#wrNote').textContent=CAT.t('wr.note',{s:secs});
  $('#wrGo').disabled=false;
  $('#wr').classList.add('open');
}
function closeWrite(){ $('#wr').classList.remove('open'); }
function writeAll(){ openWrite(); }
/** The work list in words -- a count alone does not say whether this is what
 *  the user meant. */
function describeDiff(d){
  const out=[];
  for(const b of d.bindings){
    const name=CAT.keyIdToName(b.keyId);
    const cur=(b.binding.codes||[]).length||b.binding.mouse
      ? describe(b.binding.kind,b.binding.codes||[],b.binding.mouse)
      : CAT.t('wr.none');
    out.push('<div>'+CAT.t('wr.diffRow',
      {L:b.layer,k:esc(name),v:esc(cur)})+'</div>');
  }
  /* A mode that ignores the palette still sends colours -- writeLeds carries
     mode and colours in one packet -- but sends them unchanged, staged from
     the device by commitColors. So the line says the colours stay as they
     are, not that they are withheld. */
  for(const L of d.leds){
    const md=DRAFT&&DRAFT.leds&&DRAFT.leds[L], t=md&&modeTraits(md.mode);
    if(t&&!t.perKey){
      out.push('<div>'+CAT.t('wr.ledModeOnly',{L})+'</div>'
        +`<div class="quiet">${esc(CAT.t('wr.ledModeOnlyNote'))}</div>`);
    }else out.push('<div>'+CAT.t('wr.ledBoth',{L})+'</div>');
  }
  return out.join('');
}
async function doWrite(){
  const d=PENDING;
  if(!PAD||!d.count) return closeWrite();
  $('#wrGo').disabled=true;
  let done=0;
  /* A write takes seconds and re-reads the pad at the end. A connect or
     reload landing mid-write would reconcile against a half-written pad and
     could raise a conflict dialog. Hold the same flag a read holds. */
  WRITING=true; READING=true; publish();
  try{
    for(const b of d.bindings){
      $('#wrSub').textContent=CAT.t('wr.progress',{i:done+1,n:d.count});
      await PAD.writeBinding({...b.binding,layer:b.layer});
      done++;
    }
    for(const L of d.leds){
      $('#wrSub').textContent=CAT.t('wr.progress',{i:done+1,n:d.count});
      const led=DRAFT.leds[L]||{mode:0,colors:[]};
      const rgb=Array.from({length:16},(_,i)=>fromHex(led.colors[i]||'#000000'));
      await PAD.writeLeds(L,led.mode|0,rgb);
      done++;
    }
    closeWrite();
    /* Read the pad back rather than assume the write took, so the button
       lights again for exactly what is missing.

       The read cannot follow the last commit immediately. Measured on the
       device: a read issued right after the final COMMIT_GAP still answers
       with the pre-write values, so a correct write reads as "not
       reflected". Let it settle, then read. */
    $('#wrSub').textContent=CAT.t('wr.verifying');
    await D_SLEEP(SETTLE_AFTER_WRITE);
    DEVICE=MODEL.toPlain(await PAD.readAll());
    refresh();
    msg(PENDING.count
      ? CAT.t('wr.partial',{n:done,p:PENDING.count})
      : CAT.t('wr.done',{n:done}), PENDING.count?'err':'ok');
  }catch(e){
    closeWrite();
    /* A failed run leaves the pad half-written, so re-read the baseline and
       let the diff say what is left. */
    try{ DEVICE=MODEL.toPlain(await PAD.readAll()); }catch{ DEVICE=null; }
    refresh();
    msg(CAT.t('wr.failed',{n:done,e:e.message}),'err');
  }finally{
    /* refresh() ran in both paths with the flags still set, so the button
       shows "reading". Clear them and redraw once more. */
    WRITING=false; READING=false; refresh();
  }
}
/** Throw away the design and take what the pad holds. */
function revertToDevice(){
  if(!DEVICE){ msg(CAT.t('msg.notRead'),'err'); return; }
  setDraft(MODEL.cloneConfig(DEVICE));
  msg(CAT.t('msg.reverted'),'ok');
}

/* the connect-time conflict */
function openConflict(d){
  $('#cfList').innerHTML='<div>'+CAT.t('cf.count',{n:d.count})+'</div>'
    +describeDiff(d);
  $('#cf').classList.add('open');
}
function resolveConflict(which){
  $('#cf').classList.remove('open');
  if(which==='device'){
    setDraft(MODEL.cloneConfig(DEVICE));
    msg(CAT.t('msg.loaded'),'ok');
  }else{
    refresh();
    msg(CAT.t('msg.keptDraft'),'ok');
  }
}

/* export and import. Two exports, because "save what I have" can mean the
   design on screen or the pad's actual contents, and they may differ. */
function toggleMenu(e){
  const m=e.currentTarget.parentElement;
  m.classList.toggle('open');
  /* Registered after this click, or the click that opened it closes it. */
  if(m.classList.contains('open')){
    setTimeout(()=>document.addEventListener('click',
      function off(){ m.classList.remove('open');
        document.removeEventListener('click',off); },{once:true}),0);
  }
}
function download(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  a.click(); URL.revokeObjectURL(a.href);
}
/* Down to the second: two exports within a minute would otherwise share a
   filename, which the browser resolves by silently appending (1). */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`
        +`-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function exportApp(){
  if(!DRAFT) return msg(CAT.t('msg.nothingToSave'),'err');
  download(MODEL.toExport(DRAFT,'app',{at:new Date().toISOString()}),
           `macropad-app-${stamp()}.json`);
  msg(CAT.t('msg.exportedApp'),'ok');
}
/** The pad's own contents, read fresh -- not the baseline, which could be
 *  minutes old. */
async function exportDevice(){
  if(!PAD) return msg(CAT.t('msg.noDevice'),'err');
  try{
    msg(CAT.t('msg.readingDevice'),'');
    const cfg=MODEL.toPlain(await PAD.readAll());
    DEVICE=cfg; syncWrite();
    download(MODEL.toExport(cfg,'device',
      {at:new Date().toISOString(),device:PAD.name}),
      `macropad-device-${stamp()}.json`);
    msg(CAT.t('msg.exportedDevice'),'ok');
  }catch(e){ msg(CAT.t('msg.readFail',{e:e.message}),'err'); }
}
async function importFile(e){
  const f=e.target.files&&e.target.files[0];
  e.target.value='';                       // so the same file can be picked twice
  if(!f) return;
  try{
    const r=MODEL.fromExport(JSON.parse(await f.text()));
    if(!r.ok) return msg(r.why,'err');
    setDraft(r.config);
    msg(CAT.t(PAD?'msg.importedWrite':'msg.imported'),'ok');
  }catch(err){ msg(CAT.t('msg.importFail',{e:err.message}),'err'); }
}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeEditor();};
$('#cp').onclick=e=>{if(e.target.id==='cp')closeCopyTo();};
$('#wr').onclick=e=>{if(e.target.id==='wr')closeWrite();};
/* The conflict dialog deliberately has no click-outside and no cancel:
   dismissing it would leave the page in neither state. */
/* A reminder, not a guard: the design is in localStorage either way. */
window.addEventListener('beforeunload',e=>{
  if(PENDING&&PENDING.count&&PAD){ e.preventDefault(); e.returnValue=''; }
});
/* boot() is async and nothing awaits it, so a throw inside would vanish
   silently and the page would just look slow. */
boot().catch(e=>{
  console.error('boot failed', e);
  msg(CAT.t('msg.startFail',{e:e.message}),'err');
});
</script>
</body>
</html>
