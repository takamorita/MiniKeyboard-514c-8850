<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234c8dff%27/%3E%3Cg fill=%27%23fff%27%3E%3Crect x=%277%27 y=%277%27 width=%277%27 height=%277%27 rx=%271.6%27/%3E%3Crect x=%2718%27 y=%277%27 width=%277%27 height=%277%27 rx=%271.6%27/%3E%3Crect x=%277%27 y=%2718%27 width=%277%27 height=%277%27 rx=%271.6%27/%3E%3Ccircle cx=%2721.5%27 cy=%2721.5%27 r=%273.9%27/%3E%3C/g%3E%3C/svg%3E">
<title>MiniKeyboard</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b21; --panel2:#20242c; --line:#2e3440;
    --fg:#e7eaf0; --dim:#8d95a6; --accent:#4a9eff; --accent2:#2b6fd0;
    --ok:#3ddc84; --err:#ff7a7a; --warn:#ffc46b;
    --case:#3a3d44; --case2:#2c2f35; --metal:#c9ccd1; --metal2:#9aa0a8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:11px 20px;
         background:var(--panel);border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0;font-weight:600}
  .grow{flex:1}
  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
         border-radius:7px;padding:8px 14px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent2);border-color:var(--accent2)}
  button.primary:hover{background:var(--accent)}
  button.on{background:var(--accent2);border-color:var(--accent);color:#fff}
  .wrap{max-width:1240px;margin:0 auto;padding:22px}

  /* ================= device ================= */
  .device{background:linear-gradient(160deg,var(--case),var(--case2));
          border-radius:20px;padding:28px 34px;display:flex;gap:40px;
          box-shadow:inset 0 1px 0 #ffffff12,0 10px 30px #0009;
          position:relative;align-items:flex-start}
  /* Static tint, not a pulse. */
  .device.animated{box-shadow:inset 0 1px 0 #ffffff12,0 10px 30px #0009,
                   0 0 34px -6px #4a9eff40}
  .screws{position:absolute;inset:12px;pointer-events:none}
  .screws i{position:absolute;width:9px;height:9px;border-radius:50%;
            background:radial-gradient(circle at 35% 35%,#7b8089,#40444b)}
  .screws i:nth-child(1){left:0;top:0}   .screws i:nth-child(2){right:0;top:0}
  .screws i:nth-child(3){left:0;bottom:0}.screws i:nth-child(4){right:0;bottom:0}

  .keys{display:grid;grid-template-columns:repeat(4,96px);
        grid-auto-rows:86px;gap:12px}
  .key{position:relative;border-radius:10px;cursor:pointer;
       border:1px solid #00000045;padding:6px;
       display:flex;flex-direction:column;align-items:center;
       justify-content:center;transition:transform .05s;
       box-shadow:0 3px 5px #0007,inset 0 1px 0 #ffffff30}
  .key:hover{filter:brightness(1.12)}
  .key:active{transform:translateY(1px)}
  .key.sel{outline:3px solid var(--accent);outline-offset:2px}
  .key .n{position:absolute;top:3px;left:7px;font-size:10px;opacity:.6}
  .key .lab{font-size:12px;font-weight:700;text-align:center;line-height:1.2;
            word-break:break-word;max-height:3.6em;overflow:hidden}
  .key .cnt{position:absolute;top:3px;right:7px;font-size:10px;opacity:.7}

  .knobs{display:flex;flex-direction:column;gap:22px;align-items:center;
         padding-top:4px}
  .knobrow{display:flex;gap:34px}
  .knobwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
  .knobname{font-size:11px;color:#cfd4dc;font-weight:600}
  .knobline{display:flex;align-items:center;gap:8px}
  .knob{position:relative;border-radius:50%;cursor:pointer;
        background:radial-gradient(circle at 38% 32%,#eef0f2,var(--metal) 46%,
                   var(--metal2));
        border:1px solid #7e838b;box-shadow:0 4px 8px #0008;
        display:flex;align-items:center;justify-content:center;
        transition:transform .05s}
  .knob::after{content:"";position:absolute;inset:24%;border-radius:50%;
        background:repeating-conic-gradient(#0000 0 6deg,#00000012 6deg 12deg);
        box-shadow:inset 0 0 7px #0003}
  .knob:hover{filter:brightness(1.06)}
  .knob:active{transform:translateY(1px)}
  .knob.s{width:74px;height:74px} .knob.m{width:96px;height:96px}
  .knob.l{width:124px;height:124px}
  .knob.sel{outline:3px solid var(--accent);outline-offset:3px}
  .knob .press{position:relative;z-index:1;font-size:11px;font-weight:700;
        color:#2a2e34;text-align:center;max-width:80%;line-height:1.15;
        word-break:break-word;max-height:3.4em;overflow:hidden}
  .turn{min-width:74px;max-width:96px;padding:8px 7px;border-radius:9px;
        background:#22262e;border:1px solid var(--line);cursor:pointer;
        text-align:center;color:var(--fg)}
  .turn .ar{display:block;font-size:18px;line-height:1}
  .turn .bd{display:block;font-size:11px;opacity:.85;word-break:break-word;
            max-height:2.6em;overflow:hidden;margin-top:2px}
  .turn:hover{border-color:var(--accent)}
  .turn.sel{outline:3px solid var(--accent);outline-offset:2px}
  .switches{display:flex;flex-direction:column;gap:6px;justify-content:center;
            align-self:center}
  .switches i{width:20px;height:6px;border-radius:3px;background:#5a5f67;
              box-shadow:inset 0 1px 0 #ffffff18}

  /* pad, driven by the LED mode.
     render() writes background/color as inline styles, so rules that must
     overrule a stored colour need !important. */

  /* 0 -- dark */
  .keys[data-mode="0"] .key{background:#2a2d33!important;color:#8d95a6!important}

  /* 2 and 3 -- reactive: dark until pressed; hover stands in for a press.
     Dimmed rather than blanked so the labels stay readable. */
  .keys[data-mode="2"] .key,.keys[data-mode="3"] .key{
       filter:brightness(.32) saturate(.25);transition:filter .12s}
  .keys[data-mode="2"] .key:hover,.keys[data-mode="3"] .key:hover{
       filter:brightness(1.25);box-shadow:0 0 22px 3px #ffffff30,
       0 3px 5px #0007,inset 0 1px 0 #ffffff30}
  /* 3 adds a ripple on ::after; pointer-events:none so it cannot swallow
     the click. */
  .keys[data-mode="3"] .key::after{content:"";position:absolute;
       inset:0;border-radius:10px;pointer-events:none;opacity:0;
       border:2px solid #ffffffcc}
  .keys[data-mode="3"] .key:hover::after{animation:keyripple .9s ease-out infinite}
  @keyframes keyripple{0%{opacity:.85;transform:scale(.35)}
                       100%{opacity:0;transform:scale(1.5)}}

  /* 4 -- one sweep across the pad. The travel is the column stagger, not the
     gradient: same animation everywhere, each column a quarter-cycle behind.
     nth-child(4n+N) addresses columns -- the grid is 4 wide. */
  .keys[data-mode="4"] .key,.keys[data-mode="5"] .key{
       color:#f2f4f8!important;text-shadow:0 1px 3px #0009;background-image:none}
  .keys[data-mode="4"] .key{animation:keywave 2.4s linear infinite}
  .keys[data-mode="4"] .key:nth-child(4n+2){animation-delay:-.6s}
  .keys[data-mode="4"] .key:nth-child(4n+3){animation-delay:-1.2s}
  .keys[data-mode="4"] .key:nth-child(4n+0){animation-delay:-1.8s}
  /* 5 -- same colours and speed, no stagger. The stagger is deliberately the
     ONLY difference from mode 4, so the duration is repeated, not varied. */
  .keys[data-mode="5"] .key{animation:keywave 2.4s linear infinite}
  /* background-color, not background: an animated longhand outranks the
     inline declaration render() writes; a shorthand would not. */
  @keyframes keywave{0%{background-color:#ff0055}  20%{background-color:#ffb300}
    40%{background-color:#28e07a} 60%{background-color:#00b7ff}
    80%{background-color:#7a5cff} 100%{background-color:#ff0055}}

  /* Reduced motion: 2 and 3 keep the dim/hover contrast and lose the ripple;
     the wave modes freeze on one colour of the sweep. */
  @media (prefers-reduced-motion:reduce){
    .keys[data-mode="3"] .key:hover::after{animation:none;opacity:.7;
         transform:scale(1)}
    .keys[data-mode="4"] .key,.keys[data-mode="5"] .key{
         animation:none;background-color:#7a5cff!important}
    .keys[data-mode="2"] .key,.keys[data-mode="3"] .key{transition:none}
  }

  .bar{display:flex;gap:8px;align-items:center;margin:16px 0 0}
  .hint{font-size:12px;color:var(--dim)}

  /* ================= LED area ================= */
  .ledarea{margin-top:14px;border:1px solid var(--line);border-radius:11px;
           background:var(--panel);overflow:hidden}
  .ledarea.open{border-color:var(--accent)}
  .ledbar{display:flex;align-items:center;gap:11px;width:100%;
          background:none;border:0;cursor:pointer;padding:11px 14px;
          font:inherit;color:var(--fg);text-align:left;border-radius:0}
  .ledbar:hover{background:#ffffff06;border-color:transparent}
  .ledbar .cap{font-size:11px;font-weight:700;letter-spacing:.1em;
               color:var(--dim);flex:none}
  .ledbar .nm{font-weight:600;font-size:13px;flex:none}
  .ledbar .why{color:var(--dim);font-size:12px;flex:1;min-width:0;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ledbar .chev{flex:none;color:var(--dim);font-size:11px;transition:.2s;
                display:inline-block}
  .ledarea.open .ledbar .chev{transform:rotate(180deg)}
  /* The 12 key colours, so the palette can be read without opening it. */
  .ledbar .strip{display:flex;gap:2px;flex:none}
  .ledbar .strip i{width:9px;height:16px;border-radius:2px;border:1px solid #0007}
  .ledarea[data-perkey="0"] .ledbar .strip{opacity:.22;filter:grayscale(1)}
  /* The dot says WHAT KIND of mode this is, never what colour the LEDs will
     be -- so it is achromatic, and modes are told apart by form (hollow,
     solid, breathing, drifting). Only the 12-colour strip may show hue. */
  .ledbar .dot{width:12px;height:12px;border-radius:50%;flex:none;
               background:var(--dim);box-shadow:none}
  /* 消灯 */
  .ledarea[data-mode="0"] .ledbar{opacity:.65}
  .ledarea[data-mode="0"] .dot{background:transparent;
       box-shadow:inset 0 0 0 2px #4a4f58}
  /* 常時点灯 */
  .ledarea[data-mode="1"] .dot{background:var(--fg);
       box-shadow:0 0 9px 1px #e7eaf055}
  /* 反応・波紋 -- breathes */
  .ledarea[data-mode="2"] .dot,.ledarea[data-mode="3"] .dot{
       background:var(--fg);animation:ledpulse 1.5s ease-in-out infinite}
  @keyframes ledpulse{0%,100%{box-shadow:0 0 0 0 #e7eaf000}
                      50%{box-shadow:0 0 10px 2px #e7eaf0aa}}
  /* ウェーブ1・2 -- only brightness travels; no hue at any point. */
  .ledarea[data-mode="4"] .dot,.ledarea[data-mode="5"] .dot{
       background:var(--dim);animation:leddrift 2.6s ease-in-out infinite}
  @keyframes leddrift{0%,100%{background:#5a6068;box-shadow:0 0 0 0 #e7eaf000}
                      50%{background:#e7eaf0;box-shadow:0 0 10px 2px #e7eaf066}}
  @media (prefers-reduced-motion:reduce){
    .ledarea .dot{animation:none!important}
    /* the static fallback must be achromatic too */
    .ledarea[data-mode="4"] .dot,.ledarea[data-mode="5"] .dot{
         background:var(--dim);box-shadow:0 0 7px 1px #e7eaf044}
    .ledbar .chev{transition:none}
  }
  .ledbody{display:none;padding:3px 14px 14px;border-top:1px solid var(--line)}
  .ledarea.open .ledbody{display:block}
  /* Which keys a swatch click will paint. */
  .ledtarget{font-size:12px;color:var(--dim);background:#0d0f14;
             border:1px solid var(--line);border-radius:7px;padding:7px 11px}
  .ledtarget b{color:var(--accent);font-weight:600}
  /* A mode that ignores the palette dims its colour controls rather than
     hiding them. pointer-events is what actually stops the clicking --
     opacity alone leaves a control that looks dead and still works. */
  .ledarea[data-perkey="0"] .ledcolors{opacity:.38;pointer-events:none;
                                       filter:grayscale(.7)}
  .ledwhy{display:none;font-size:12px;color:var(--warn);line-height:1.55;
          background:#ffc86e12;border:1px solid #ffc86e33;border-radius:7px;
          padding:8px 11px;margin:8px 0 2px}
  .ledarea[data-perkey="0"] .ledwhy{display:block}
  .swatches{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;
            margin:8px 0 12px}
  .swatches i{height:26px;border-radius:5px;cursor:pointer;border:1px solid #0006}
  .swatches i:hover{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:10px}
  label{font-size:12px;color:var(--dim);min-width:70px}
  select,input[type=number],input[type=text]{background:#0d0f14;color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;
    font-size:13px;font-family:inherit}
  input[type=color]{width:46px;height:34px;padding:2px;background:#0d0f14;
    border:1px solid var(--line);border-radius:7px;cursor:pointer}

  /* ================= editor overlay ================= */
  .overlay{position:fixed;inset:0;background:#000a;backdrop-filter:blur(3px);
           display:none;align-items:flex-start;justify-content:center;
           padding:28px;z-index:50;overflow:auto}
  .overlay.open{display:flex}
  /* Without max-height the sheet grows to fit the key list and the inner
     scroller never has anything to scroll -- the page scrolls instead. */
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         width:min(1240px,100%);padding:22px 24px;box-shadow:0 20px 60px #000b;
         display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
  /* The half that scrolls. The negative margins put the scrollbar at the
     sheet's true edge; the matching padding realigns the content.

     With overflow-x:hidden here, overflow-y can never compute to `visible`
     -- CSS forces it to `auto`. Changing the y value alone does nothing. */
  .sheetscroll{overflow-y:auto;overflow-x:hidden;flex:1;
               border-top:1px solid var(--line);
               margin:14px -24px -22px;padding:14px 24px 22px;
               scrollbar-gutter:stable;
               /* A floor, not min-height:0. Free shrinking collapsed this
                  to ~36px of padding on a 700px viewport, hiding every key
                  button, with nothing left to scroll. With a floor the
                  sheet overflows and .overlay{overflow:auto} takes over. */
               min-height:200px}
  .sheet h3{margin:0 0 4px;font-size:17px}
  .sheet .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  /* On a short screen the fixed half leaves nothing for the key list, so
     drop what is read once, not what is acted on. */
  @media (max-height:820px){
    .sheet .sub{display:none}
    .pkpanel h4.pktitle{display:none}
    .sheet{padding:16px 24px}
  }
  @media (max-height:700px){
    .modrow .mhint{display:none}
    .sheetscroll{padding-top:10px;margin-top:10px}
  }

  .modtog{padding:3px 6px;font-size:10px;font-weight:700;border-radius:4px;
          margin-right:2px;min-width:0;opacity:.45;letter-spacing:.01em}
  .modtog:hover{opacity:1}
  .modtog.on{opacity:1;background:var(--acc);border-color:var(--acc);
             color:#08131f}
  /* ---------- chip strip ---------- */
  .chipwrap{position:relative}
  .chipstrip{display:flex;flex-wrap:wrap;align-items:center;gap:0;
             min-height:74px;padding:10px 12px;border-radius:10px;
             background:#0d0f14;border:1px solid var(--line);cursor:text;
             align-content:flex-start}
  .chipstrip.focus{border-color:var(--accent);box-shadow:0 0 0 2px #4a9eff2b}
  .chipstrip .ph{color:var(--dim);font-size:13px;padding:6px 2px}
  .chip{display:inline-flex;align-items:center;gap:6px;
        padding:7px 11px;border-radius:8px;margin:3px 0;
        background:var(--panel2);border:1px solid var(--line);
        font-size:14px;font-weight:600;line-height:1.2;cursor:pointer;
        white-space:nowrap;user-select:none}
  .chip:hover{border-color:var(--accent)}
  .chip.sel{background:#5b9dff2e;border-color:var(--accent);color:#fff}
  .chip.over{border-color:var(--err);background:#ff7a7a1f;color:var(--err)}
  .chip.mod{background:#ffc86e1c;border-color:#ffc86e55}
  /* The armed-modifier ghost: PENDING, not a chip -- not in SEQ, not
     clickable or deletable, gone the moment a key is picked. */
  .chip.ghost{background:#ffc86e14;border:1px dashed #ffc86e88;
              color:var(--warn);cursor:default;opacity:.9}
  .chip.ghost:hover{border-color:#ffc86e88}
  .chip.big{font-size:15px;padding:9px 13px}
  .chip .cost{font-size:10px;font-weight:700;color:var(--accent);
              vertical-align:super;letter-spacing:0}
  .chip.over .cost{color:var(--err)}
  .chip .ms{font-size:11px;font-weight:500;color:var(--dim)}
  .chip .kindtag{font-size:10px;padding:1px 6px;border-radius:99px;
                 background:var(--accent2);color:#fff;font-weight:700}
  .caret{width:2px;height:26px;margin:3px 3px;border-radius:1px;
         background:transparent;flex:0 0 2px}
  .chipstrip.focus .caret.on{background:var(--accent);
         animation:blink 1.06s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .chipin{position:absolute;opacity:0;width:1px;height:1px;padding:0;
          border:0;background:transparent;color:transparent;
          left:0;top:0;pointer-events:none}
  .gap{flex:0 0 6px;height:26px}
  .seqfoot{display:flex;gap:9px;align-items:center;margin-top:16px;
           flex-wrap:wrap}
  .slotinfo{font-size:12px;color:var(--dim)}
  .slotinfo.warn{color:var(--warn);font-weight:600}
  .slotinfo.over{color:var(--err);font-weight:600}
  .slotnote{font-size:11px;color:var(--dim)}

  /* chip popover (spec 9). Anchored inside .chipwrap (position:relative) so
     it scrolls with the strip instead of drifting on resize. */
  .chippop{position:absolute;z-index:70;display:none;
           background:var(--panel);border:1px solid var(--accent);
           border-radius:11px;padding:12px 13px;min-width:326px;
           box-shadow:0 14px 40px #000c}
  .chippop.open{display:block}
  .chippop .pophd{font-size:12px;color:var(--dim);margin-bottom:9px;
                  display:flex;align-items:center;gap:8px}
  .chippop .pophd b{color:var(--fg);font-size:14px}
  .chippop .poprow{display:flex;gap:6px;align-items:center;
                   margin-bottom:9px;flex-wrap:wrap}
  .chippop .poprow > label{min-width:52px;font-size:11px}
  .chippop .modtog{padding:6px 11px;font-size:12px;min-width:0;
                   opacity:.5;font-weight:600}
  .chippop .modtog.on{opacity:1;background:var(--acc);
                      border-color:var(--acc);color:#08131f}
  .chippop .rmore{padding:6px 9px;font-size:11px;opacity:.7}
  .chippop .rgroup{display:none;width:100%;gap:6px;flex-wrap:wrap}
  .chippop .rgroup.open{display:flex}
  .chippop input[type=number]{width:88px;padding:6px 8px;font-size:13px}
  .chippop .popfoot{display:flex;gap:6px;align-items:center;
                    margin-top:11px;flex-wrap:nowrap}
  .chippop .popfoot button{font-size:12px;padding:7px 11px;white-space:nowrap}
  .chippop .danger{border-color:var(--err);color:var(--err)}
  .chippop .danger:hover{background:#ff7a7a1f}
  .chippop .hintline{font-size:11px;color:var(--dim);margin-top:8px}

  /* copy-to-another-key dialog (spec 11) */
  .copygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;
            margin:4px 0 10px}
  .copygrid button{padding:10px 8px;font-size:13px;border-radius:8px;
                   font-weight:600;white-space:nowrap;overflow:hidden;
                   text-overflow:ellipsis}
  .copygrid button.on{border-color:var(--acc);background:#5b9dff26}
  .copylayers{display:flex;gap:6px;align-items:center;margin-bottom:12px;
              flex-wrap:wrap}
  .copylayers button.on{border-color:var(--acc);background:#5b9dff26}
  .copyprev{font-size:12px;color:var(--dim);background:#0d0f14;
            border:1px solid var(--line);border-radius:8px;padding:9px 11px;
            margin:6px 0 12px;word-break:break-all;font-family:inherit}

  /* modal shell -- used ONLY by 他のキーへコピー (#cp). The key picker is
     inline in the editor sheet (#pkPanel). */
  .picker{position:fixed;inset:0;background:#000b;display:none;z-index:60;
          align-items:flex-start;justify-content:center;padding:28px;
          overflow:auto}
  .picker.open{display:flex}
  .pbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        width:min(1080px,100%);padding:20px 22px}

  /* inline key picker panel */
  .pkpanel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .pkpanel h4.pktitle{margin:0 0 8px;font-size:13px;font-weight:600}
  .ptabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .ptabs button{padding:9px 16px;font-size:13px}
  /* modifier row: always visible (CHIPSPEC 14.2). A modifier is a state that
     rides along with the next pick, not a tab you can be "not on". It sits in
     the sheet's fixed half, so it is not sticky. */
  .modrow{display:flex;align-items:center;
          gap:6px;flex-wrap:wrap;padding:9px 10px;margin:14px 0 0;
          border:1px solid var(--line);border-radius:10px;
          background:var(--bg2,#141922)}
  .modrow .mlab{font-size:11px;color:var(--dim);letter-spacing:.06em;
                margin-right:2px}
  .modrow button{min-width:66px;padding:9px 12px;font-size:13px;
                 border-radius:8px;font-weight:600}
  /* Everything picked from here on carries it, so make it unmistakable. */
  .modrow button.on{border-color:var(--warn);background:#ffc86e2e;
                    color:var(--warn)}
  /* Always shown. (The chip popover's own .rgroup toggle is a different
     row.) */
  .modrow .rgroup{display:flex;gap:6px;flex-wrap:wrap}
  .modrow .rmore{min-width:0;padding:9px 11px;font-size:12px;color:var(--dim)}
  .modrow .mhint{font-size:11px;color:var(--dim);width:100%;margin-top:2px}
  /* jump tabs: they scroll, they do not switch */
  .jumps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .jumps button{padding:8px 15px;font-size:13px}
  .jumps button.on{border-color:var(--acc);color:var(--acc)}
  /* the three co-located blocks. scroll-margin-top only has to clear the
     scroller's own top padding -- the modifier row is outside it. */
  .pblock{margin:0 0 18px;scroll-margin-top:8px}
  /* A quiet divider, not a heading -- the fixed tabs above already name
     these three. */
  .pblab{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--dim);
         letter-spacing:.08em;padding-bottom:5px;
         border-bottom:1px solid var(--line)}
  .pblock.dim{opacity:.5}
  .pblock.dim .pnote{color:var(--warn)}
  /* Sizes to its CONTENT and must never scroll internally -- an inner
     scrolling box hid most of 文字・数字. On a short viewport it is the
     overlay (.overlay{overflow:auto}) that scrolls. */
  .pgrid{display:flex;flex-wrap:wrap;gap:7px;overflow:visible;
         padding:4px 2px}
  /* reselect banner: transient "swap this chip's key" mode */
  .pkmode{display:none;align-items:center;gap:10px;flex-wrap:wrap;
          margin:0 0 10px;padding:9px 12px;border-radius:9px;
          background:#ffc86e1f;border:1px solid var(--warn);
          color:var(--warn);font-size:13px;font-weight:600}
  .pkmode.on{display:flex}
  .pkmode button{font-size:12px;padding:6px 12px}
  .pgrid button{min-width:62px;padding:11px 13px;font-size:14px;
                border-radius:8px;font-weight:600}
  .pgrid button.wide{min-width:132px;font-size:13px}
  .pnote{color:var(--dim);font-size:12px;width:100%;margin:4px 0 8px}
  /* 文字・数字 tab. The Shift toggle flips the WHOLE grid to shifted glyphs;
     while on, every button costs 2 slots. */
  .pshift{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%;
          margin:0 0 8px}
  .pshift .hint{font-size:12px;color:var(--dim)}
  .pshift button{min-width:104px;padding:9px 14px;font-size:13px}
  .pshift button.on{border-color:var(--warn);background:#ffc86e26;
                    color:var(--warn)}
  .pgroup{display:flex;flex-wrap:wrap;gap:7px;width:100%;align-items:center;
          margin:0 0 4px}
  .pglab{font-size:11px;color:var(--dim);width:100%;margin:2px 0 1px;
         letter-spacing:.06em}
  /* Compact squares so 英字+数字+記号 all fit above the fold. */
  .pgrid button.chbtn{min-width:34px;width:34px;height:34px;padding:0;
                      font-size:15px;line-height:34px;text-align:center;
                      display:inline-flex;align-items:center;
                      justify-content:center;border-radius:7px}
  /* tighter gaps inside a character group */
  .pgroup{gap:5px}
  /* search-driven picker */
  .psearch{width:100%;padding:12px 14px;font-size:15px;border-radius:9px;
           border:1px solid var(--line);background:#0e1116;color:var(--fg);
           font-family:inherit;box-sizing:border-box}
  .psearch:focus{outline:none;border-color:var(--acc)}
  button:disabled{opacity:.4;cursor:not-allowed}
  /* The write button is disabled far more often than not, so it must read
     as "nothing to do" rather than broken. */
  button.primary:disabled{opacity:.55;background:var(--panel2);
                          border-color:var(--line);color:var(--dim)}
  /* An unsaved change is the one thing a user can lose. */
  #pending{color:var(--warn)}
  .menu{position:relative}
  .menupop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;
           background:var(--panel);border:1px solid var(--line);border-radius:10px;
           padding:6px;min-width:200px;box-shadow:0 12px 32px #0009}
  .menu.open .menupop{display:block}
  .menupop button{display:block;width:100%;text-align:left;border:0;
                  background:transparent;padding:9px 11px}
  .menupop button:hover{background:var(--panel2)}
  .menupop hr{border:0;border-top:1px solid var(--line);margin:5px 2px}
  .difflist{max-height:230px;overflow:auto;margin:10px 0;border:1px solid var(--line);
            border-radius:9px;background:#0e1116;padding:8px 10px;font-size:12px}
  .difflist div{padding:3px 0;color:var(--dim)}
  .difflist b{color:var(--fg);font-weight:600}
  /* A footnote to the line above, not an entry of its own. */
  .difflist .quiet{padding:0 0 3px 12px;font-size:11px;opacity:.72}
  .psearch.bad{border-color:var(--err);background:#ff7a7a14}
  /* search hits are capped in number by the search code, so no scroll box */
  .cands{display:grid;gap:5px;margin:8px 0 4px;
         overflow:visible;align-content:start;
         grid-template-columns:repeat(2,1fr)}
  .cands:empty{margin:0}
  @media(max-width:560px){.cands{grid-template-columns:1fr}}
  .cands button{display:flex;align-items:center;gap:10px;text-align:left;
                padding:10px 13px;font-size:14px;border-radius:8px;width:100%}
  .cands button.on{border-color:var(--acc);background:#5b9dff1f}
  .cands .nm{font-weight:600}
  .cands .meta{color:var(--dim);font-size:12px;margin-left:auto;
               white-space:nowrap}
  .cbadge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
          background:#5b9dff26;color:var(--acc);letter-spacing:.04em}
  .cbadge.mod{background:#ffc86e26;color:var(--warn)}
  .cbadge.sp{background:#ff7a7a26;color:var(--err)}
  .nohit{color:var(--err);font-size:13px;padding:10px 2px}
  #msg{padding:9px 13px;border-radius:7px;font-size:12px;margin-top:12px;
       display:none}
  #msg.ok{display:block;background:#3ddc8420;color:var(--ok)}
  #msg.err{display:block;background:#ff7a7a20;color:var(--err)}
  .warn{font-size:12px;color:var(--warn);margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>MiniKeyboard</h1>
  <span id="ver" class="hint" style="font-size:11px"></span>
  <div style="display:flex;gap:6px" id="layerBtns"></div>
  <div class="grow"></div>
  <button id="connectBtn" onclick="connectDevice()" data-i18n="btn.connect"></button>
  <button id="disconnectBtn" onclick="disconnectDevice()" style="display:none"
          data-i18n="btn.disconnect"></button>
  <span id="transport" class="hint"></span>
  <div class="menu">
    <button onclick="toggleMenu(event)" data-i18n="btn.export"></button>
    <div class="menupop">
      <button onclick="exportApp()" data-testid="exportapp" data-i18n="btn.exportApp"></button>
      <button onclick="exportDevice()" data-testid="exportdevice" data-i18n="btn.exportDevice"></button>
      <hr>
      <button onclick="$('#importFile').click()" data-testid="import" data-i18n="btn.import"></button>
    </div>
  </div>
  <input type="file" id="importFile" accept="application/json,.json"
         style="display:none" onchange="importFile(event)">
  <button id="reloadBtn" onclick="reload()" style="display:none"
          data-testid="reload" data-i18n="btn.reload" data-i18n-title="tip.reload"></button>
  <button id="revertBtn" onclick="revertToDevice()" style="display:none"
          data-testid="revert" data-i18n="btn.revert"></button>
  <button class="primary" id="writeBtn" onclick="writeAll()" disabled
          data-testid="write" data-i18n="btn.write"></button>
  <span id="pending" class="hint"></span>
</header>

<div class="wrap">
  <div class="device">
    <div class="screws"><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys"></div>
    <div class="switches"><i></i><i></i><i></i></div>
    <div class="knobs" id="knobs"></div>
  </div>
  <div class="bar">
    <span class="hint" id="padHint" data-i18n="pad.hint"></span>
  </div>

  <!-- Collapsed, this is a status line: mode, the 12 key colours, and what
       the mode does. -->
  <div class="ledarea" id="ledarea" data-mode="0" data-perkey="1"
       data-testid="ledarea">
    <button class="ledbar" id="ledbar" data-testid="ledbar"
            onclick="toggleLedArea()" aria-expanded="false"
            aria-controls="ledbody">
      <span class="dot"></span>
      <span class="cap">LED</span>
      <span class="nm" id="barName"></span>
      <span class="strip" id="barStrip"></span>
      <span class="why" id="barWhy"></span>
      <span class="chev">▼</span>
    </button>
    <div class="ledbody" id="ledbody">
      <div class="row" style="margin-top:12px">
        <label data-i18n="led.mode"></label>
        <select id="ledMode" onchange="onLedMode()"></select>
      </div>
      <!-- Why the controls below are dim. Filled by syncLedBar per mode. -->
      <div class="ledwhy" id="ledWhy" data-testid="ledwhy"></div>
      <div class="ledcolors" id="ledColors" data-testid="ledcolors">
        <div class="ledtarget" id="ledTarget" data-testid="ledtarget"></div>
        <div class="swatches" id="swatches"></div>
        <div class="row" style="margin-bottom:0">
          <label data-i18n="led.customColor"></label>
          <input type="color" id="ledAll" value="#4a9eff">
          <button onclick="applyAll()" data-i18n="led.applyAll"></button>
          <div class="grow"></div>
          <span class="hint" data-i18n="led.writeHint"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- #msg is where every status message on the page lands. -->
  <div class="warn" id="wirelessNote"></div>
  <div id="msg" data-testid="toast"></div>
</div>

<!-- sequence editor -->
<div class="overlay" id="ov">
  <div class="sheet">
    <h3 id="ovTitle">key01</h3>
    <div class="sub" data-i18n="ed.intro"></div>
    <div class="chipwrap">
      <div class="chipstrip" id="chipStrip" data-testid="chipstrip"
           onmousedown="stripMouseDown(event)"></div>
      <input class="chipin" id="chipIn" data-testid="chipinput"
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="chippop" id="chippop" data-testid="chippop"></div>
    </div>
    <div class="seqfoot">
      <span class="slotinfo" id="slotinfo" data-testid="slotinfo"></span>
      <span class="slotnote" id="slotnote" data-testid="slotnote"></span>
      <span id="meterMount"></span>
      <div class="grow"></div>
      <button onclick="openCopyTo()" data-i18n="ed.copyTo"></button>
      <button onclick="closeEditor()" data-i18n="ed.cancel"></button>
      <button onclick="clearSeq()" data-i18n="ed.clearAll"></button>
      <button class="primary" id="saveBtn" data-testid="save"
              onclick="saveSeq()" data-i18n="ed.confirm"></button>
    </div>
    <!-- inline key picker panel (always visible; no modal). What you hunt
         WITH stays above the scroll line; only the key blocks scroll. -->
    <div class="pkpanel" id="pkPanel" data-testid="pkpanel">
      <h4 class="pktitle"><span data-i18n="pk.title"></span>
        <span class="hint" id="pkFor" data-testid="pkfor"
              style="font-weight:400;margin-left:6px"></span></h4>
      <div class="pkmode" id="pkMode" data-testid="pkmode">
        <span id="pkModeText"></span>
        <button data-testid="pkmodecancel" onclick="cancelReselect()" data-i18n="pk.stop"></button>
      </div>
      <div class="modrow" id="modrow" data-testid="modrow"></div>
      <input class="psearch" id="psearch" data-testid="psearch"
             autocomplete="off" spellcheck="false"
             data-i18n-placeholder="pk.search"
             oninput="onSearch()" onkeydown="searchKey(event)">
      <div class="cands" id="cands" data-testid="cands"></div>
      <div class="jumps" id="jumps" data-testid="jumps"></div>
    </div>

    <!-- Everything above stays put; everything below scrolls, so the chips
         and the finish buttons never leave the screen. -->
    <div class="sheetscroll" id="sheetScroll" data-testid="sheetscroll">
      <div id="pblocks" data-testid="pblocks"></div>
    </div><!-- /.sheetscroll -->
  </div>
</div>

<!-- 接続時の食い違い: the pad may hold something other than what is on
     screen. Either side loses work, so the user chooses. Shown once, at
     connect. -->
<div class="overlay" id="cf">
  <div class="sheet">
    <h3 data-i18n="cf.title"></h3>
    <div class="sub" data-i18n="cf.sub"></div>
    <div class="difflist" id="cfList"></div>
    <div class="seqfoot">
      <div class="grow"></div>
      <button onclick="resolveConflict('device')" data-testid="takedevice"
        data-i18n="cf.takeDevice"></button>
      <button class="primary" onclick="resolveConflict('draft')" data-testid="takedraft"
        data-i18n="cf.keepDraft"></button>
    </div>
  </div>
</div>

<!-- 書き込み確認 -->
<div class="overlay" id="wr">
  <div class="sheet">
    <h3 data-i18n="wr.title"></h3>
    <div class="sub" id="wrSub"></div>
    <div class="difflist" id="wrList"></div>
    <div class="seqfoot">
      <span class="hint" id="wrNote"></span>
      <div class="grow"></div>
      <button onclick="closeWrite()" data-testid="writecancel" data-i18n="wr.cancel"></button>
      <button class="primary" id="wrGo" onclick="doWrite()" data-testid="writego"
        data-i18n="wr.go"></button>
    </div>
  </div>
</div>

<!-- 他のキーへコピー (spec 11) -->
<div class="picker" id="cp">
  <div class="pbox" style="width:min(760px,100%)">
    <h3 style="margin:0 0 2px" data-i18n="cp.title"></h3>
    <div class="sub hint" id="cpFrom"></div>
    <div class="copyprev" id="cpPrev" data-testid="copyprev"></div>
    <h4 style="margin:0 0 8px;font-size:12px;color:var(--dim)" data-i18n="cp.layer"></h4>
    <div class="copylayers" id="cpLayers"></div>
    <h4 style="margin:0 0 8px;font-size:12px;color:var(--dim)" data-i18n="cp.target"></h4>
    <div class="copygrid" id="cpTargets" data-testid="copytargets"></div>
    <div class="seqfoot">
      <span class="hint" id="cpNote"></span>
      <div class="grow"></div>
      <button onclick="closeCopyTo()" data-i18n="cp.cancel"></button>
      <button class="primary" id="cpGo" data-testid="copygo"
              onclick="doCopyTo()" data-i18n="cp.go"></button>
    </div>
  </div>
</div>

<script>
/* The two states. DRAFT is what the user is designing: it survives a closed
   tab and is the only thing an edit touches. DEVICE is what the hardware last
   told us, replaced only by a read. The write button's enabled-ness comes from
   the difference. STATE is the render-ready view of DRAFT. See pad-model.js. */
let DRAFT=null, DEVICE=null;
/* True while a pad read is in flight. `let` does not hoist and syncWrite() is
   defined above loadDevice(), so it must be declared here or the first render
   throws before the page appears. */
let READING=false, WRITING=false;
let META=null, STATE=null, LAYER=1, SEL=null, COLORS=[];
let SEQ=[];            // [{kind:'key'|'mouse'|'media', code:int, label:str, ms:int}]
let PICK_ROW=-1;

/* Chip editor state.
   CARET: 0..SEQ.length, the gap index the invisible input follows.
   SELA/SELB: half-open selection [SELA,SELB) over chip indices; SELA<0 = none.
   Exactly one of caret state and selection state is active at a time. */
let CARET=0, SELA=-1, SELB=-1;
let UNDO=[], REDO=[];
const MAXCHIPS=40;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
/* PAD is the only thing here that knows how bytes reach the device. See
   pad-driver.js.

   This script is deliberately NOT type="module": ~25 inline onclick handlers
   resolve against window, and module scope would break every one of them
   silently. Modules are pulled in with a dynamic import instead. */
let PAD=null, CAT=null, WIRE=null, MODEL=null;
let D_SLEEP=ms=>new Promise(r=>setTimeout(r,ms)), SETTLE_AFTER_WRITE=600;

async function initPad(){
  CAT  = await import('./catalog.js');
  WIRE = await import('./pad-wire.js');
  MODEL= await import('./pad-model.js');
  window.MODEL=MODEL;
  const D = await import('./pad-driver.js');
  window.PadHttp=D.PadHttp; window.PadWebHid=D.PadWebHid; window.PadMock=D.PadMock;
  /* Timing constants live with the driver that measured them, not here. */
  D_SLEEP=D.sleep; SETTLE_AFTER_WRITE=D.SETTLE_AFTER_WRITE;
  // A test may install its own PAD before boot; never overwrite that.
  /* A test cannot construct a PadMock before boot -- the class arrives with
     the module boot is loading -- so it asks and boot builds it. window.PAD
     alone does not survive the reloads a persistence test needs. */
  if(!PAD && window.__padMock) PAD = new D.PadMock(window.__padMock);
  if(!PAD) PAD = window.PAD || await D.autoDriver();   // may be null
  window.PAD=PAD; window.CAT=CAT; window.WIRE=WIRE;
  return PAD;
}
/** Offer to connect over WebHID. Requires a user gesture, hence the button.
 *  The read becomes DEVICE, the comparison baseline -- it does NOT overwrite
 *  the screen. On disagreement the user picks a side. */
async function connectDevice(){
  try{
    const d=new window.PadWebHid();
    await d.connect();
    PAD=d; window.PAD=d;
    syncTransport();
    msg(CAT.t('msg.connected'),'ok');
    await loadDevice();
  }catch(e){ msg(CAT.t('msg.connectFail',{e:e.message}),'err'); syncTransport(); }
}
/* A read takes about a second per layer and the page stays live throughout.
   Marking it busy stops the write path acting on a moving baseline, and stops
   a second read starting on top of the first. */
/** Read the pad into DEVICE and reconcile it with the draft. */
async function loadDevice(){
  if(!PAD){ msg(CAT.t('msg.noDevice'),'err'); return; }
  if(READING){ return; }
  /* publish() right away, so a watcher can see the read start. */
  READING=true; publish();
  /* refresh(), not syncWrite(): the mirrored copy of READING must update too,
     or a waiter on "read finished" waits forever. */
  try{ await loadDeviceInner(); } finally{ READING=false; refresh(); }
}
async function loadDeviceInner(){
  /* readAll gives a 0-based LED array and driver-shaped bindings; toPlain
     normalises both. */
  DEVICE = MODEL.toPlain(await PAD.readAll());
  if(!DRAFT || isEmptyDraft()){
    /* Nothing designed yet: adopt the pad without asking. */
    setDraft(MODEL.cloneConfig(DEVICE));
    msg(CAT.t('msg.loaded'),'ok');
    refresh(); return;
  }
  const d=MODEL.diff(DRAFT,DEVICE);
  /* refresh() BEFORE the dialog: it recomputes the diff and publishes the new
     baseline. Skipping it left the write button judging against the previous
     device state (null on a first connect), so a matching pad looked dirty. */
  refresh();
  if(!d.count){ msg(CAT.t('msg.inSync'),'ok'); return; }
  openConflict(d);
}
/** True when the draft holds nothing the user would mind losing.
 *
 *  diff() alone is wrong here: it treats an absent LED record as "no opinion",
 *  so a draft whose only content is a colour scheme compares equal to an empty
 *  one and gets silently replaced on connect. Check both halves. */
function isEmptyDraft(){
  if(!DRAFT) return true;
  if(MODEL.diff(DRAFT,MODEL.emptyConfig()).count) return false;
  return ![1,2,3].some(L=>DRAFT.leds&&DRAFT.leds[L]);
}
/* Two different things are called "disconnect":
     close()   this page lets go; the permission stands, so reopening
               reconnects with no prompt.
     forget()  the permission goes; the next connect must ask.
   The button does the second. */
async function disconnectDevice(){
  if(!PAD || PAD.name!=='webhid'){ msg(CAT.t('msg.notDirect'),'err'); return; }
  try{
    await PAD.forget();
    await window.PadWebHid.forgetAll();   // stale grants from earlier sessions
    PAD=null; window.PAD=null;
    /* The design stays; only the comparison baseline goes. */
    DEVICE=null;
    msg(CAT.t('msg.disconnected'),'ok');
    refresh();
  }catch(e){ msg(CAT.t('msg.disconnectFail',{e:e.message}),'err'); }
}
function syncTransport(){
  const el=$('#transport'); if(!el) return;
  const via=PAD&&PAD.name;   // null once disconnected
  el.textContent = via==='webhid' ? CAT.t('conn.webhid')
                 : via==='mock'   ? CAT.t('conn.mock')
                 : CAT.t('conn.none');
  const c=$('#connectBtn'), d=$('#disconnectBtn'), r=$('#reloadBtn');
  if(c) c.style.display = (via==='webhid'||via==='mock') ? 'none' : '';
  if(d) d.style.display = (via==='webhid') ? '' : 'none';
  if(r) r.style.display = via ? '' : 'none';
}
/* The write button. Enabled exactly when the draft differs from the device,
   so "already written" is computed rather than remembered. With no pad it is
   disabled for a different reason and says which. */
function syncWrite(){
  const b=$('#writeBtn'), p=$('#pending'), r=$('#revertBtn');
  if(!b) return;
  const d=DRAFT?MODEL.diff(DRAFT,DEVICE):{count:0,bindings:[],leds:[]};
  PENDING=d;
  if(READING){
    /* Mid-read: any diff against the baseline is provisional, so wait. */
    b.disabled=true; b.textContent=CAT.t('conn.loading');
    p.textContent=''; if(r) r.style.display='none';
    return;
  }
  if(!PAD){
    b.disabled=true;
    b.textContent=CAT.t('btn.write');
    p.textContent=d.count?CAT.t('conn.offlineN',{n:d.count}):'';
    if(r) r.style.display='none';
    return;
  }
  b.disabled=!d.count;
  b.textContent=d.count?CAT.t('btn.writeN',{n:d.count}):CAT.t('btn.written');
  p.textContent=d.count?CAT.t('conn.unwritten'):'';
  if(r) r.style.display=(DEVICE&&d.count)?'':'none';
}
let PENDING={count:0,bindings:[],leds:[]};
/** Redraw everything that depends on the draft: pad, LED panel, write
 *  button. Called after every edit. */
function refresh(){
  STATE = DRAFT ? viewOf(DRAFT) : {layers:{1:[],2:[],3:[]},leds:{}};
  const led=STATE.leds[LAYER];
  COLORS = led ? led.colors.slice(0,12) : Array(12).fill('#000000');
  const ms=$('#ledMode');
  if(ms&&led) ms.value=led.mode;
  if(META) syncLedBar();
  render(); syncTransport(); syncWrite(); publish();
}
/** Persist the draft and redraw. Every edit goes through here; saving per
 *  edit rather than on a timer makes a closed tab cost nothing. */
function setDraft(cfg){
  DRAFT=cfg;
  MODEL.saveDraft(DRAFT);
  refresh();
}
/* `let` at the top of a classic script is not a window property, so the two
   states are invisible outside this file -- including to the browser test.
   Mirror them on window after every change. */

/* Fill every element carrying a data-i18n* attribute from the string table.
   An untranslated element shows its key, which is easier to spot than a
   blank. */
function applyI18n(root){
  const R=root||document;
  R.querySelectorAll('[data-i18n]').forEach(el=>{
    /* innerHTML, not textContent: several carry <b>, and the table is ours --
       no user input in it. */
    el.innerHTML=CAT.t(el.dataset.i18n);
  });
  R.querySelectorAll('[data-i18n-title]').forEach(el=>{
    el.title=CAT.t(el.dataset.i18nTitle);
  });
  R.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder=CAT.t(el.dataset.i18nPlaceholder);

async function boot(){
  /* After initPad, not before: CAT arrives with the module import. Calling it
     first read `t` off a null CAT and took the page down. */
  await initPad();
  applyI18n();
  /* META now comes from catalog.js, not the server: the shape is kept, the
     source is local, so the page works with no server behind it. */
  META={ chars:CAT.charTable(), hidnames:{...CAT.HID_NAMES,...CAT.KEYPAD_NAMES},
         mouse:CAT.mouseNames(), media:CAT.mediaNames(),
         modes:CAT.ledModeList(), swatches:CAT.VENDOR_PALETTE,
         wireless:CAT.wirelessNote(), max_codes:CAT.MAX_CODES,
         targets:CAT.allTargets().map(t=>t.name) };
  const vs=$('#ver'); if(vs) vs.textContent='build '+(vs.dataset.v||'?');
  META.modes.forEach(m=>$('#ledMode').add(new Option(m.n+' — '+(m.label||m.name),m.n)));
  $('#layerBtns').innerHTML=[1,2,3].map(n=>
    `<button id="lb${n}" onclick="setLayer(${n})">${esc(CAT.t('pad.layer',{n}))}</button>`).join('');
  $('#swatches').innerHTML=(META.swatches||[]).flat().map(h=>
    `<i title="${h}" style="background:${h}" onclick="useSwatch('${h}')"></i>`).join('');
  $('#wirelessNote').textContent=META.wireless||'';
  restoreLedArea();
  buildCharMaps(); bindChipInput();
  /* Restore the draft before touching the device, so a page opened with no
     pad is still the page the user left. */
  DRAFT = MODEL.loadDraft() || MODEL.emptyConfig();
  setLayer(1);
  /* Say why up front. Without this the connect button looks live and fails
     on the click with an internal error about getDevices. */
  const why = !window.PadWebHid.supported() ? 'msg.noWebhid'
            : !window.isSecureContext       ? 'msg.insecure' : null;
  if(why){
    const c=$('#connectBtn'); if(c) c.disabled=true;
    msg(CAT.t(why),'err');
    return;
  }
  if(!PAD){
    msg(MODEL.diff(DRAFT,null).count
      ? CAT.t('msg.restored') : CAT.t('msg.pickDevice'),'');
    return;
  }
  await loadDevice();
}
/* Re-read the pad: refreshes the comparison baseline and reconciles the
   draft against it, as at connect time. Does not touch the screen. */
async function reload(){
  if(!PAD){ msg(CAT.t('msg.noDeviceHint'),'err'); return; }
  try{ await loadDevice(); }
  catch(e){ msg(CAT.t('msg.cannotConnect',{e:e.message}),'err'); }
}
/* The draft in the shape render() wants: snake_case key_id, resolved label,
   hex colours. The one place the model's shape and the UI's meet. */
function viewOf(all){
  const layers={}, leds={};
  for(const L of [1,2,3]){
    const rows=(all.layers&&all.layers[L])||[];
    layers[L]=rows.map(r=>{
      const keyId=r.keyId!==undefined?r.keyId:r.key_id;
      const codes=r.kind===CAT.KIND_MOUSE&&r.mouse
        ? [r.mouse.buttons||r.mouse.mod||0] : (r.codes||[]);
      return { key_id:keyId, name:r.name||CAT.keyIdToName(keyId),
               kind:r.kind, codes, delays:r.delays||[],
               // keep the mouse fields: the editor cannot reconstruct a wheel
               // or a modifier from a button code alone
               ...(r.mouse?{mouse:r.mouse}:{}),
               label:r.label!==undefined?r.label:describe(r.kind,codes,r.mouse) };
    }).filter(r=>CAT.isPhysical(r.key_id));
    /* LEDs arrive 0-based from both drivers; expose them 1-based like layers.
       Colours arrive as [r,g,b] triples or '#rrggbb'; everything downstream
       works in hex, so convert here. */
    /* A driver read gives a 0-based array; the model gives a 1-based object.
       Indexing the object branch 0-based read layer 2's colours onto 1. */
    const src=all.leds; const raw=Array.isArray(src)?src[L-1]:(src&&src[L]);
    leds[L]=raw?{mode:raw.mode,colors:(raw.colors||[]).map(toHex)}:null;
  }
  return {layers,leds};
}
/** '#rrggbb', whether it arrived as that or as an [r,g,b] triple. */
function toHex(c){
  if(typeof c==='string') return c;
  if(!Array.isArray(c)) return '#000000';
  return '#'+c.slice(0,3).map(v=>(v|0).toString(16).padStart(2,'0')).join('');
}
/** The [r,g,b] triple the driver wants, from the UI's hex string. */
function fromHex(h){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(h)||'');
  if(!m) return [0,0,0];
  const n=parseInt(m[1],16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
/** A human label for a binding the driver did not name for us. */
function describe(kind,codes,mouse){
  if(kind===CAT.KIND_MOUSE){
    const m=mouse||{};
    /* Match on the unmodified action and prefix the modifier separately.
       The table used to carry Ctrl+ホイール↑ and its five siblings as their
       own entries; they are gone from the picker, but the device can still
       be holding one -- and reading a real binding back as NULL because the
       button that made it no longer exists would be a lie about the pad. */
    const base=CAT.MOUSE_ACTIONS.find(a=>
      (a.buttons|0)===(m.buttons|0) && (a.wheel|0)===(m.wheel|0));
    if(base){
      const mod=m.mod|0;
      return mod ? (CAT.MODS[mod]||('0x'+mod.toString(16)))+'+'+base.label
                 : base.label;
    }
    if(m.buttons&&CAT.MOUSE_BUTTONS[m.buttons]) return CAT.MOUSE_BUTTONS[m.buttons];
    return 'NULL';
  }
  if(!codes||!codes.length) return 'NULL';
  if(kind===CAT.KIND_MEDIA) return CAT.mediaLabel(codes[0]);
  /* Same rule as the chip strip (chipText): name the key by what it TYPES on
     this layout, and where Shift alone has a glyph of its own, show the glyph
     instead of the prefix. `Shift + RBracket` was two wrongs at once -- a US
     key name for a key this board does not have, and a modifier that the
     layout already folds into `{`. */
  return WIRE.foldMods(codes).map(c=>keyCombo(c.code,c.mods)).join(' ');
}
/** One folded chip as text: `[`, `{`, `Ctrl+c`, `Ctrl+Shift+Delete`.
 *  Shared by the pad faces, the write dialog and the diff list so all three
 *  name a key the same way. */
function keyCombo(code,mods){
  const ms=CAT.sortMods(mods||[]);
  if(CAT.isMod(code)&&!ms.length) return CAT.MODS[code]||hidLabel(code);
  if(!ms.length) return baseName(code);
  if(ms.length===1&&ms[0]===0xF2){
    const sh=shiftName(code);
    if(sh) return sh;                 // Shift+0x30 is `{`, not `Shift + [`
  }
  return ms.map(m=>CAT.MODS[m]).concat(baseName(code)).join('+');
}
/* Switching layers is a view change, not a device round-trip. */
function setLayer(n){LAYER=n;SEL=null;

    ? '#16181d':'#f2f4f8';

/* sequence editor */
function openEditor(name){
  SEL=name;
  const e=byName(name);
  SEQ=[];
  if(e && e.label!=='NULL'){
    if(e.kind===3||e.kind===2){
      SEQ=[{kind:e.kind===3?'mouse':'media',code:e.codes[0],
            label:e.label,ms:0,
            ...(e.kind===3&&e.mouse?{mouse:e.mouse}:{})}];
    }else{
      /* wire -> chips (spec 6): fold each run of modifier slots into the key
         that follows; a trailing run stays its own chip. The delay comes
         from the key slot (modifier slots are 0ms). */
      let pend=[];
      (e.codes||[]).forEach((c,i)=>{
        const ms=(e.delays&&e.delays[i])||0;
        if(isMod(c)){ pend.push(c); return; }
        SEQ.push({kind:'key',code:c,label:hidLabel(c),ms,
                  mods:sortMods(pend)});
        pend=[];
      });
      if(pend.length){
        // trailing modifiers: first is the chip, the rest ride as its mods
        const head=pend[0], rest=pend.slice(1);
        SEQ.push({kind:'key',code:head,label:hidLabel(head),ms:0,
                  mods:sortMods(rest)});
      }
    }
  }
  $('#ovTitle').textContent=name;
  UNDO=[]; REDO=[]; clearSel(); CARET=SEQ.length;
  closeChipPopover();
  /* The editor sets SEL so the palette's target line follows it, but does
     not open the area -- the overlay covers it. */
  renderSeq(); $('#ov').classList.add('open'); render(); syncLedTarget();
  initPicker();                    // the inline panel is part of the editor
  setTimeout(focusStrip,0);
}
function closeEditor(){ closeChipPopover(); closeCopyTo();
  POP_RESELECT=-1; syncPickerHead();     // never leave the mode armed
  $('#ov').classList.remove('open'); SEL=null; render(); syncLedTarget(); }
function clearSeq(){ closeChipPopover();
  pushUndo(); SEQ=[]; clearSel(); CARET=0; renderSeq();
  focusStrip(); }

/* The key's NAME, for keys the layout does not turn into a character.
   Characters go through baseName()/CHARBASE instead. */
function hidLabel(c){
  if(CAT.MODS[c]) return CAT.MODS[c];
  if(META.hidnames && META.hidnames[c]) return META.hidnames[c];
  return '0x'+c.toString(16).toUpperCase();
}
const MAXSLOT=()=>META.max_codes||18;
const isSpecial=()=>SEQ.length&&(SEQ[0].kind==='mouse'||SEQ[0].kind==='media');

/* chip editor core. One SEQ row == one chip == 1..n wire slots. The strip is
   rebuilt from SEQ on every mutation; there is no DOM-held state. */

const MODNAMES={0xF1:'Ctrl',0xF2:'Shift',0xF3:'Alt',0xF4:'Win',
                0xF5:'RCtrl',0xF6:'RShift',0xF7:'RAlt',0xF8:'RWin'};
const MODORDER=[0xF1,0xF2,0xF3,0xF4,0xF5,0xF6,0xF7,0xF8];
const isMod=c=>MODORDER.includes(c);
/* Split for the always-visible row; both halves write the same eight
   codes. */
const MODS_LEFT=[0xF1,0xF2,0xF3,0xF4];
const MODS_RIGHT=[0xF5,0xF6,0xF7,0xF8];
const sortMods=a=>a.slice().sort((x,y)=>MODORDER.indexOf(x)-MODORDER.indexOf(y));

/* Display name derived from `code`, never from `label` (spec 4).
   CHARBASE/CHARSHIFT are built from META.chars so the JIS layout wins:
   0x30 is `[` on this device even though HID calls it RBracket. */
let CHARBASE={}, CHARSHIFT={};
function buildCharMaps(){
  CHARBASE={}; CHARSHIFT={};
  for(const [ch,info] of Object.entries(META.chars||{})){
    if(info.shift){ if(!(info.usage in CHARSHIFT)) CHARSHIFT[info.usage]=ch; }
    else { if(!(info.usage in CHARBASE)) CHARBASE[info.usage]=ch; }
  }
  for(let i=0;i<26;i++){
    const u=0x04+i;
    if(!(u in CHARBASE))  CHARBASE[u]=String.fromCharCode(97+i);
    if(!(u in CHARSHIFT)) CHARSHIFT[u]=String.fromCharCode(65+i);
  }
}
/* base glyph / name for a key code, always lowercase for letters.
   The layout table answers FIRST and CHARBASE is only the fallback: CHARBASE
   is META.chars inverted, and the inversion is lossy where two usages type
   the same character (JIS 0x87/0x89 both type `\`). The layout is keyed by
   usage, so it cannot lose one. */
function baseName(code){
  const g=CAT.keyLabel(code,false);
  if(g) return g;
  if(code in CHARBASE) return CHARBASE[code];
  if(isMod(code)) return MODNAMES[code];
  return hidLabel(code);
}
/* the shifted glyph, if this code has one (`a`->`A`, `1`->`!`) */
function shiftName(code){
  return CAT.keyLabel(code,true)||CHARSHIFT[code]||null;
}

/* Chip display text, per spec 2.
   - plain chip, no mods            -> base glyph            `a` `[` `Enter`
   - plain chip, Shift only, and the code has a shifted glyph -> that glyph `A` `!`
   - anything else with mods        -> explicit form, base ALWAYS lowercase
                                       `Ctrl+c` `Ctrl+Shift+c` `Ctrl+Alt+Delete`
   So an uppercase letter never appears inside a modifier chip: `A` can only
   mean Shift+a, `Ctrl+c` can only mean Ctrl+c. */
function chipText(r){
  if(r.kind!=='key') return r.label;
  const mods=sortMods(r.mods||[]);
  if(isMod(r.code) && !mods.length) return MODNAMES[r.code];
  if(!mods.length) return baseName(r.code);
  if(mods.length===1 && mods[0]===0xF2){
    const s=shiftName(r.code);
    if(s) return s;                       // `A` / `!` -- Shift is in the glyph
  }
  return mods.map(m=>MODNAMES[m]).concat(baseName(r.code)).join('+');
}
const SUBDIG='₀₁₂₃₄₅₆₇₈₉';
function costBadge(n){
  if(n<=1) return '';
  return String(n).split('').map(d=>SUBDIG[+d]).join('');
}

function clearSel(){ SELA=-1; SELB=-1; }
const hasSel=()=>SELA>=0&&SELB>SELA;
function setSel(a,b){ SELA=Math.max(0,Math.min(a,b));
  SELB=Math.min(SEQ.length,Math.max(a,b)); if(SELB<=SELA) clearSel(); }

function focusStrip(){ const i=$('#chipIn'); if(i) i.focus({preventScroll:true}); }
function editorOpen(){ return $('#ov').classList.contains('open'); }

function renderSeq(){ renderChips(); }

/** The armed modifiers, drawn as a pending chip: [Ctrl+]. Not a real chip --
 *  not in SEQ, not clickable or deletable, gone the moment a key is picked
 *  or the modifier is disarmed. */
function armedGhost(){
  if(!ARMED.length) return '';
  return `<span class="chip ghost" data-testid="armedghost" aria-hidden="true"
    >${esc(ARMED.map(c=>MODNAMES[c]).join('+'))}+</span>`;
}
function renderChips(){
  const S=$('#chipStrip'); if(!S) return;
  S.innerHTML='';
  const focused=document.activeElement===$('#chipIn');
  S.classList.toggle('focus',focused);
  if(!SEQ.length){
    S.innerHTML='<span class="caret on" data-testid="caret" data-i="0"></span>'
      +armedGhost()
      +`<span class="ph">${esc(CAT.t('ed.placeholder'))}</span>`;
  }else{
    // cumulative cost decides where the 18-slot overflow starts (spec 7)
    const max=MAXSLOT(); let acc=0; const over=[];
    SEQ.forEach(r=>{ acc+=rowCost(r); over.push(acc>max); });
    for(let i=0;i<=SEQ.length;i++){
      const c=document.createElement('span');
      const live=!hasSel()&&CARET===i;
      c.className='caret'+(live?' on':'');
      /* QA hook: every gap is caret-N, but the bare `caret` testid marks only
         the LIVE gap. */
      c.dataset.testid=live?'caret':('caret-'+i);
      c.dataset.i=i;
      S.appendChild(c);
      /* An armed modifier shows as a ghost chip at the caret -- where the key
         it is waiting for will land. */
      if(live && ARMED.length) S.insertAdjacentHTML('beforeend',armedGhost());
      if(i===SEQ.length) break;
      const r=SEQ[i], cost=rowCost(r);
      const sel=hasSel()&&i>=SELA&&i<SELB;
      const special=r.kind!=='key';
      const modOnly=r.kind==='key'&&isMod(r.code)&&!(r.mods||[]).length;
      const d=document.createElement('span');
      d.className='chip'+(sel?' sel':'')+(over[i]?' over':'')
                 +(modOnly?' mod':'')+(special?' big':'');
      d.dataset.testid='chip';
      d.dataset.i=i;
      if(sel) d.dataset.selected='1';
      if(over[i]) d.dataset.over='1';
      d.title=chipText(r);
      d.innerHTML=(special
          ?`<span class="kindtag">${esc(CAT.t(r.kind==='mouse'?'chip.mouse':'chip.media'))}</span>`
          :'')
        +`<span class="tx">${esc(chipText(r))}</span>`
        +(cost>1?`<span class="cost" data-testid="cost">${costBadge(cost)}</span>`:'')
        +(special?`<span class="kindtag">${esc(CAT.t('chip.solo'))}</span>`:'')
        +((!special&&r.ms)?`<span class="ms">⏱${r.ms}</span>`:'');
      d.onmousedown=ev=>{ev.stopPropagation();};
      d.onclick=ev=>{ev.stopPropagation(); chipClick(i);};
      S.appendChild(d);
    }
  }
  renderMeter();
  const sv=$('#saveBtn'); if(sv) sv.disabled=!validateSeq().ok;
  positionInput();
  syncPopover();
  syncPickerHead();      // "N番目に挿入" tracks the caret
}

/* slot meter / cost accounting (spec 7). Yellow from 16 steps, red over the
   limit. The per-chip red tint lives in renderChips(). */
function WARNSLOT(){ return Math.max(1,MAXSLOT()-2); }   // 18 -> warn at 16
function renderMeter(){
  const used=seqCost(), max=MAXSLOT();
  const el=$('#slotinfo');
  if(el){
    const v=validateSeq();
    el.textContent=v.ok
      ? CAT.t('ed.meter',{c:SEQ.length,u:used,m:max})
      : v.why;
    // over-limit wins over the 16+ warning; both are steps-driven, not text
    el.className='slotinfo'+(used>max?' over':(used>=WARNSLOT()?' warn':''));
  }
  /* spec 7 補足文: only meaningful once modifiers add steps, i.e. total cost
     exceeds the chip count. Exact wording is fixed. */
  const nt=$('#slotnote');
  if(nt) nt.textContent=(SEQ.length&&used>SEQ.length)
    ? CAT.t('ed.meterNote'):'';
